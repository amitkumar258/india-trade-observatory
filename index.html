.sc-l { font-size: 14.5px; color: var(--ink); }
.sc-track { position: relative; height: 22px; background: var(--deep); border: 1px solid var(--ink-10); margin-top: 8px; }
.sc-bar { height: 100%; }
.sc-split { display: flex; }
.sc-split span { height: 100%; min-width: 2px; }

.bd-h { font-size: 14px; font-weight: 600; margin: 22px 0 8px; color: var(--ink); }

.verdicts .vn { font-size: 19px; font-weight: 600; line-height: 1.1; }
.verdicts .vl { font-size: 14px; margin-top: 2px; }
.verdicts .vv { font-family: var(--mono); font-size: 11px; color: var(--ink-50); margin-top: 6px; letter-spacing: 0.03em; }

  .sv-row { grid-template-columns: 1fr; gap: 8px; }

}

  .statement { font-size: 22px; }

}

.kpi .v { font-size: 28px; font-weight: 600; line-height: 1.15; margin-top: 6px; white-space: nowrap; }
.kpi .s { font-size: 13px; color: var(--ink-70); margin-top: 2px; }

.stack { display: flex; height: 30px; border: var(--rule); margin-top: 6px; }

.stack span[data-tip]:hover { filter: brightness(1.12); }
#bartip { position: fixed; display: none; z-index: 70; pointer-events: none; background: var(--ink); color: #fff; padding: 8px 11px; font-size: 13px; line-height: 1.35; max-width: 280px; }

.term { color: inherit; text-decoration: underline dotted var(--wine); text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: help; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 13px; color: var(--ink-70); }

/* Category badges */
.badge {
  display: inline-block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 2px 7px; white-space: nowrap; border: 1px solid transparent;
}

/* Data tables */
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data th {
  font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-50); text-align: left; padding: 9px 10px; border-top: 2px solid var(--ink); border-bottom: var(--rule);
  white-space: nowrap; background: var(--paper); vertical-align: bottom;
}

.side-filters-wrap > summary { cursor: pointer; list-style: none; }

.kicker { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--wine); font-weight: 600; margin: 0 0 8px; }

/* One h1 holds both the figure and the sentence, so search engines read them as one sentence */

.st-wrap .statement-h { display: block; }
.st-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; max-width: 900px; margin: 6px 0 18px; }

@media (max-width: 640px) { .st-wrap { grid-template-columns: 1fr; gap: 8px; } .st-num { font-size: 56px; } }

details.why { border: var(--rule); background: var(--deep); margin: 0 0 14px; }

.ch-links { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13.5px; margin: 8px 0 0; }
.pn { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 18px; border-top: var(--rule); }
.pn .btn, .cta .btn { font-family: var(--sans); font-size: 14px; letter-spacing: 0; text-transform: none; padding: 9px 15px; text-decoration: none; color: var(--ink); display: inline-block; }

.vis-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 2px; }

.basis-box .legend > span { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--ink-10); }
.basis-box .legend > span:last-child { border-bottom: 0; }
.basis-box .legend i { margin: 0; }
.basis-box .legend b { font-weight: 600; text-align: right; white-space: nowrap; }

/* Funnel: the method in one picture */
.funnel { display: grid; gap: 14px; margin: 30px 0 6px; }
.fn-row { display: grid; grid-template-columns: 230px minmax(0, 1fr); align-items: center; color: inherit; text-decoration: none; }

/* Year columns and the dependence histogram */
.ycols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; align-items: end; margin-top: 8px; }
.yc { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; text-align: center; }

.hist { position: relative; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; align-items: end; border-bottom: 1px solid var(--ink); padding-top: 26px; }
.hb { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.hb .hv { font-size: 11.5px; color: var(--ink-70); margin-bottom: 4px; }
.hb .hbar { display: block; width: 58%; background: #cfc8c2; }
.hb.pass .hbar { background: var(--wine); }
.hline { position: absolute; left: calc(30% - 2px); top: 0; bottom: -32px; border-left: 2px dashed var(--ink); }
.hline span { position: absolute; left: 6px; top: 0; background: var(--ink); color: #fff; font-size: 11.5px; padding: 3px 7px; white-space: nowrap; }
.hlabels { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; font-size: 10.5px; white-space: nowrap; color: var(--ink-50); text-align: center; margin-top: 6px; }

/* Verdict strip and change lists */
/* Substitutability ladder: two questions; items leave at the side, the rest step down */
.sorter { display: grid; grid-template-columns: minmax(0, 1.25fr) 84px minmax(0, 1fr); column-gap: 0; row-gap: 0; margin: 18px 0 22px; align-items: stretch; }
.sorter .so { background: var(--paper); border: var(--rule); border-top: 4px solid var(--vc, var(--ink)); padding: 12px 14px; min-width: 0; }
.sorter .g-a { grid-column: 1; grid-row: 1; } .sorter .g-a2 { grid-column: 3; grid-row: 1; }
.sorter .g-d1 { grid-column: 1; grid-row: 2; }
.sorter .g-q1 { grid-column: 1; grid-row: 3; } .sorter .g-h1 { grid-column: 2; grid-row: 3; } .sorter .g-f1 { grid-column: 3; grid-row: 3; }
.sorter .g-d2 { grid-column: 1; grid-row: 4; }
.sorter .g-q2 { grid-column: 1; grid-row: 5; } .sorter .g-h2 { grid-column: 2; grid-row: 5; } .sorter .g-s1 { grid-column: 3; grid-row: 5; }
.sorter .g-d3 { grid-column: 1; grid-row: 6; }
.sorter .g-f2 { grid-column: 1; grid-row: 7; }
.sorter .g-end { grid-column: 1 / -1; grid-row: 8; margin-top: 14px; }
.sorter .so .n { font-size: 24px; font-weight: 600; line-height: 1.1; }
.sorter .so .n small { font-size: 13.5px; font-weight: 400; color: var(--ink-50); }
.sorter .so .t { font-size: 14px; font-weight: 600; margin-top: 3px; }
.sorter .so p { font-size: 13.5px; line-height: 1.45; margin: 4px 0 0; color: var(--ink-70); }
.sorter .so .v { font-size: 12px; color: var(--ink-50); margin-top: 6px; }
.sorter .so-start { --vc: var(--ink); }
.sorter .so-nodata { --vc: transparent; border-style: dashed; border-top: 1px dashed rgba(23,20,19,0.4); align-self: start; }
.sorter .so-q { background: var(--deep); --vc: var(--wine); }
.sorter .so-q .t { margin-top: 2px; font-size: 15px; }
.sorter .qn { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--wine); display: block; }
.sorter .tag { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
.sorter .tag.go { color: var(--c-opp); } .sorter .tag.stop { color: var(--ink); }
.sorter .so-end { --vc: var(--ink-50); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; font-size: 13.5px; background: var(--deep); }
/* arrows: a line and a head, drawn in CSS; the label sits beside the line */
.sorter .ar { position: relative; display: flex; align-items: center; justify-content: center; color: var(--ink-50); }
.sorter .ar.v { min-height: 46px; flex-direction: column; }
.sorter .ar.v::before { content: ''; flex: 1; width: 2px; background: currentColor; }
.sorter .ar.v::after { content: ''; border: 7px solid transparent; border-top: 9px solid currentColor; border-bottom: 0; }
.sorter .ar.h::before { content: ''; flex: 1; height: 2px; background: currentColor; }
.sorter .ar.h::after { content: ''; border: 7px solid transparent; border-left: 9px solid currentColor; border-right: 0; }
.sorter .ar span { position: absolute; font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--ink); background: var(--paper); padding: 1px 6px; border: var(--rule); white-space: nowrap; }
.sorter .ar.h span { top: 50%; left: 50%; transform: translate(-60%, -135%); border: 0; background: none; padding: 0; letter-spacing: 0.04em; }
.sorter .ar.v span { top: 50%; left: calc(50% + 12px); transform: translateY(-50%); border: 0; background: none; padding: 0; white-space: normal; max-width: 260px; }
@media (max-width: 760px) {
  .sorter { grid-template-columns: 1fr; }
  .sorter > * { grid-column: 1 !important; grid-row: auto !important; }
  .sorter .g-a { order: 1; } .sorter .g-a2 { order: 2; margin-top: 6px; } .sorter .g-d1 { order: 3; } .sorter .g-q1 { order: 4; }
  .sorter .g-h1 { order: 5; } .sorter .g-f1 { order: 6; } .sorter .g-d2 { order: 7; } .sorter .g-q2 { order: 8; }
  .sorter .g-h2 { order: 9; } .sorter .g-s1 { order: 10; } .sorter .g-d3 { order: 11; } .sorter .g-f2 { order: 12; } .sorter .g-end { order: 13; }
  .sorter .ar.h { min-height: 46px; flex-direction: column; }
  .sorter .ar.h::before { width: 2px; height: auto; }
  .sorter .ar.h::after { border: 7px solid transparent; border-top: 9px solid currentColor; border-bottom: 0; }
  .sorter .ar.h span { top: 50%; left: calc(50% + 12px); transform: translateY(-50%); }
  /* the exits step off to the side, so the spine reads straight down */
  .sorter .g-h1, .sorter .g-h2 { margin-left: 34px; }
  .sorter .g-f1, .sorter .g-s1 { margin-left: 34px; }
  .sorter .g-d2, .sorter .g-d3 { margin-top: 14px; }
}
/* About the author: a photo and a short bio */

@media (max-width: 640px) { .author .au-row { grid-template-columns: 1fr; gap: 18px 0; } .author .au-photo { width: 168px; } }
/* About: the three concerns as tabs; vulnerabilities (this Observatory) opens first */

.about .ab-tab { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center; text-align: left; font: inherit; color: var(--ink-50); background: var(--deep); border: var(--rule); border-top: 4px solid var(--ink-20); margin-left: -1px; padding: 10px 14px 9px; cursor: pointer; }

.about .ab-note { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-50); margin: 0 0 12px; }

.about .ab-cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 0 28px; }

.about .ab-w h3, .about .ab-c h3 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--mono); color: var(--ink-50); margin: 0 0 4px; font-weight: 600; }

@media (max-width: 760px) {

  .about .ab-tt { font-size: 13px; }
  .about .ab-tg { font-size: 8.5px; letter-spacing: 0.04em; }

}
/* Story map: questions open to answers; a rail shows the stage reached */
.prose .sm-rail { list-style: none; margin: 18px 0 8px; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; position: sticky; top: 0; z-index: 4; background: var(--paper); }
.prose .sm-rail li { position: relative; padding: 10px 14px 9px 12px; border: var(--rule); border-top: 4px solid var(--ink-20); margin: 0 0 0 -1px; display: flex; flex-direction: column; gap: 1px; background: var(--paper); }
.prose .sm-rail li:first-child { margin-left: 0; }
.sm-rail li b { font-size: 13.5px; font-weight: 600; color: var(--ink-50); }
.sm-rail li span { font-size: 11.5px; color: var(--ink-50); line-height: 1.3; }
.sm-rail li:not(:last-child)::after { content: '→'; position: absolute; right: 7px; top: 50%; transform: translateY(-50%); color: var(--ink-50); font-size: 15px; }
.sm-rail li.done { border-top-color: var(--wine); }

.sm-rail li.on { background: var(--wine); border-color: var(--wine); }

.sm-tools { margin: 10px 0 4px; }

.sm-q { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; background: none; border: 0; padding: 14px 16px; cursor: pointer; font: inherit; color: var(--ink); }
.sm-q:hover { background: var(--deep); }
.sm-q:focus-visible { outline: 2px solid var(--wine); outline-offset: -2px; }
.sm-n { flex: none; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; background: var(--deep); color: var(--wine); border: var(--rule); }
.sm-t { flex: 1; font-size: 16px; font-weight: 600; line-height: 1.3; }
.sm-c::before { content: '+'; font-size: 22px; line-height: 1; color: var(--wine); font-weight: 400; }

.sm-item.open .sm-n { background: var(--wine); color: #fff; border-color: var(--wine); }
.sm-a { padding: 4px 18px 18px 60px; }
.sm-a p { font-size: 15px; line-height: 1.55; margin: 8px 0 0; max-width: 70ch; }
.sm-a .sm-obs { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; background: var(--wine-soft); border-left: 4px solid var(--wine); padding: 8px 12px; font-size: 13.5px; }
.sm-a .sm-obs span { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--wine); }
.sm-a .btn { margin-top: 14px; }
@media (max-width: 640px) {
  .prose .sm-rail { grid-template-columns: 1fr 1fr; position: static; }
  .prose .sm-rail li { margin-left: 0; margin-top: -1px; }
  .prose .sm-rail li:first-child { margin-top: 0; }

  .sm-a { padding: 2px 14px 16px 14px; }
  .sm-q { padding: 12px 12px; gap: 10px; }

}

.vstrip a { background: var(--paper); padding: 12px 14px 12px; border-top: 4px solid var(--vc); color: inherit; text-decoration: none; display: flex; flex-direction: column; }

/* Explorer workspace */

.ex-top { display: flex; gap: 12px; align-items: stretch; margin: 22px 0 10px; }

<script>
/*CORE-START*/
// Thresholds: paper's Section II, with the RIF scale shifted by a factor of 0.1 for HS8 lines
// RIF tiers: Substantial 0.01 to <0.1, Major 0.1 to <1, Severe 1 and above (the paper's own top threshold)
// S_MIN: China's share of global exports below which alternatives exist; CV_MIN: export cover (exports of the product by every country except China, divided by China's exports of it to India) at or above which the rest of the world could easily cover India's purchases
const TH = { D_MIN: 30, RIF_MIN: 0.01, RIF_EXP: 0.1, RIF_EXT: 1, S_MIN: 30, CV_MIN: 20 };
// Financial years, keyed by the year they end; columns hold [total, China] imports in data.json rows
const YEARS = ['2023', '2024', '2025', '2026'];
const YCOL = { '2023': [3, 4], '2024': [5, 6], '2025': [7, 8], '2026': [9, 10] };

function depTier(d) { return d >= 70 ? 'Acute' : d >= 50 ? 'High' : d >= TH.D_MIN ? 'Moderate' : 'Below 30%'; }
function rifClass(r) { return r >= TH.RIF_EXT ? 'ext' : r >= TH.RIF_EXP ? 'exp' : r >= TH.RIF_MIN ? 'sub' : 'ins'; }
// Table 3 bands; below 1 is low-complexity dependence
function pciBand(p) {
  if (p == null) return null;
  return p >= 2 ? 'crit' : p >= 1.75 ? 'vh' : p >= 1.5 ? 'high' : p >= 1.25 ? 'mod' : p >= 1 ? 'low' : 'opp';
}
// Substitutability test: alternatives exist when China supplies under 30% of global exports and export cover is 20 or more
// (the rest of the world exports at least 20 times what India buys from China). No supplier data means no gate.
const altExists = (sw, cv) => sw != null && sw < TH.S_MIN && !(cv != null && cv < TH.CV_MIN);
function classify(row, y, sp = {}) {
  const [ti, ci] = YCOL[y];
  const t = row[ti], c = row[ci], pci = row[2];
  const d = t > 0 ? c / t * 100 : 0;
  const rif = c * d / 10000;
  const alt = altExists(sp.sw, sp.cv);
  let cat, reason = '';
  if (d < TH.D_MIN) { cat = 'below'; reason = 'Dependence below 30%'; }
  else if (rif < TH.RIF_MIN) { cat = 'below'; reason = 'RIF below 0.01'; }
  else if (alt) { cat = 'alt'; reason = 'Alternatives exist: China supplies under 30% of global exports'; }
  else if (sp.ns && !(pci != null && pci >= 1.75)) { cat = 'nsc'; reason = 'National-security sector: critical outright'; }
  else if (pci == null) { cat = 'na'; reason = 'No HS6 PCI score'; }
  else cat = pciBand(pci);
  return { t, c, d, rif, rc: rifClass(rif), cat, reason, alt };
}
/*CORE-END*/

// Non-breaking space and hyphen, so a year label never splits across lines
const FY = { '2023': 'FY\u00a02022\u201123', '2024': 'FY\u00a02023\u201124', '2025': 'FY\u00a02024\u201125', '2026': 'FY\u00a02025\u201126' };
const CAT = {
  crit:  { label: 'Critical: Extremely High complexity', short: 'Critical · Extremely High', fill: '#85200c', disr: 'Long-term' },
  vh:    { label: 'Critical: Very High complexity', short: 'Critical · Very High', fill: '#a61c00', disr: 'Medium to Long-term' },
  high:  { label: 'Strategic: High complexity', short: 'Strategic · High', fill: '#cc4125', disr: 'Medium-term' },
  mod:   { label: 'Strategic: Moderate complexity', short: 'Strategic · Moderate', fill: '#ff9900', disr: 'Short to Medium-term' },
  low:   { label: 'Strategic: Mild complexity', short: 'Strategic · Mild', fill: '#ffd966', disr: 'Short-term' },
  nsc:   { label: 'Critical: National-security sector', short: 'Critical · Security sector', fill: '#6e1a0a', disr: 'Critical outright' },
  opp:   { label: 'Low-complexity dependence', short: 'Low complexity', fill: '#2f6b6b' },
  alt:   { label: 'Alternatives exist (set aside)', short: 'Alternatives · exist', fill: '#8dbcbc' },
  na:    { label: 'Not assessed (PCI missing)', short: 'Not assessed', fill: '#ffffff' },
  below: { label: 'Below threshold', short: 'Below threshold', fill: '#d9d9d9' },
};
const CAT_ORDER = ['crit', 'vh', 'nsc', 'high', 'mod', 'low', 'opp', 'na', 'alt', 'below'];
const VULN = ['crit', 'vh', 'nsc', 'high', 'mod', 'low'];
// Very High and Extremely High complexity are critical, and so is any item in a national-security sector; Mild to High are strategic
const CRIT = ['crit', 'vh', 'nsc'];
const STRAT = ['high', 'mod', 'low'];
const COMPLEXITY = { nsc: 'Security sector', opp: 'Below 1', low: 'Mild', mod: 'Moderate', high: 'High', vh: 'Very High', crit: 'Extremely High' };
const RIFNAME = { ins: 'Insignificant', sub: 'Substantial', exp: 'Major', ext: 'Severe' };
const RIFFILL = { ins: '#d9d9d9', sub: '#cc0000', exp: '#94100c', ext: '#5b0f00' };
const MATRIX_COLS = [
  { id: 'opp',  name: 'Low-complexity dependence', range: 'PCI < 1',          lbl: 'Shortest disruption: many alternative suppliers', dur: 'Shortest' },
  { id: 'low',  name: 'Mild',           range: '1 ≤ PCI < 1.25',   lbl: 'Short-term disruption', dur: 'Short' },
  { id: 'mod',  name: 'Moderate',       range: '1.25 ≤ PCI < 1.5', lbl: 'Short to medium-term disruption', dur: 'Short to medium' },
  { id: 'high', name: 'High',           range: '1.5 ≤ PCI < 1.75', lbl: 'Medium-term disruption', dur: 'Medium' },
  { id: 'vh',   name: 'Very High',      range: '1.75 ≤ PCI < 2',   lbl: 'Medium to long-term disruption', dur: 'Medium to long' },
  { id: 'crit', name: 'Extremely High', range: 'PCI ≥ 2',          lbl: 'Long-term disruption', dur: 'Long' },
  { id: 'nsc',  name: 'Security sector', range: 'Critical outright', lbl: 'Critical: national security test', dur: 'Any' },
  { id: 'na',   name: 'PCI missing',    range: 'Not assessed',     lbl: 'Awaiting PCI score', dur: 'Not assessed' },
];
const RIF_ROWS = [
  { id: 'sub', name: 'Substantial', range: '0.01 ≤ RIF < 0.1', fill: '#cc0000' },
  { id: 'exp', name: 'Major',       range: '0.1 ≤ RIF < 1',    fill: '#94100c' },
  { id: 'ext', name: 'Severe',      range: 'RIF ≥ 1',          fill: '#5b0f00' },
];
const IPPR_URL = 'https://doi.org/10.55763/ippr.2023.04.04.003';
// National-security sectors under the SCV framework (power grids, communications, digital infrastructure,
// C4ISR, transport signalling). The quantitative scale cannot see this test, so items in these HS4 headings are flagged.
const NS_HEADINGS = {
  '8471': 'Computers and data-processing machines',
  '8473': 'Parts and accessories for computers and office machines',
  '8502': 'Electric generating sets and rotary converters',
  '8503': 'Parts for electric motors and generators',
  '8504': 'Transformers, static converters and inductors',
  '8507': 'Electric accumulators (batteries)',
  '8517': 'Telephone sets and data-communication apparatus',
  '8523': 'Storage media: discs, solid-state storage devices and smart cards',
  '8525': 'Transmission apparatus, cameras',
  '8526': 'Radar, radio navigation and remote control',
  '8529': 'Parts for transmission, radio and television apparatus',
  '8530': 'Signalling and traffic control equipment for railways, roads and waterways',
  '8531': 'Electric sound or visual signalling apparatus, such as alarms and indicator panels',
  '8535': 'Switchgear and protection apparatus above 1,000 volts',
  '8536': 'Switchgear and protection apparatus up to 1,000 volts',
  '8537': 'Control and distribution boards',
  '8541': 'Semiconductor devices',
  '8542': 'Integrated circuits',
  '8543': 'Other electrical machines with individual functions',
  '8544': 'Insulated wire, cable and optical fibre cable',
  '8806': 'Unmanned aircraft (drones)',
  '9014': 'Direction-finding compasses and navigational instruments',
};
// Basket lines: residual "other" lines, where one HS6 PCI averages over very different products
const isBasket = (hs8, name) => /9\d$/.test(hs8) || /^\W*(OTHERS?|OTHR|OTHE|0THERS?)\b/i.test(name) || /OTHERS-OF/i.test(name);
const PAPER_URL = 'https://takshashila.org.in/content/publications/assets/Derisking-Indias-Trade-With-China.pdf';

let DATA, ITEMS, BY_HS8, BY_HS6, SUP = null;
const STATS = {};
const charts = [];
const S = {
  basis: 'v', // side-box shares: by value (v) or by number of items (n)
  year: '2026', page: 'overview', mSel: null, mPage: 0, sSel: null, sPage: 0,
  ch: 0,          // At a Glance chapter
  mSec: 'about',  // Methodology section
  ex: { q: '', tab: 'vuln', band: '', flag: '', th: {}, sort: 'rif', dir: -1, page: 0, view: 'table' },
};
try { const y = localStorage.getItem('icvm-year'); if (YEARS.includes(y)) S.year = y; } catch (e) {}

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, dp = 1) => Number(v).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
const int = v => Number(v).toLocaleString('en-US');
const usd = v => v >= 1000 ? `US$${nf(v / 1000, 1)} bn` : v > 0 && v < 0.05 ? 'under US$0.1 mn' : `US$${nf(v, 1)} mn`;
const pct = v => v > 0 && v < 0.05 ? '<0.1%' : `${nf(v, 1)}%`;
// Two decimals, truncated rather than rounded so no item appears to cross a threshold (0.099 shows 0.09, not 0.10)
const rifFmt = v => v >= 0.01 ? nf(Math.floor(v * 100) / 100, 2) : v > 0 ? '<0.01' : '0';
const pciFmt = p => p == null ? 'n/a' : nf(p, 2);
const R = (i, y = S.year) => i.y[y];
// The year before the selected one, for comparisons; null for the earliest year
const other = y => YEARS[YEARS.indexOf(y) - 1] || null;
const badge = cat => `<span class="badge b-${cat}">${CAT[cat].short.split(' · ').map(esc).join('<span class="b-band">')}${CAT[cat].short.includes(' · ') ? '</span>' : ''}</span>`;
// "but" where a large disruption would pass quickly, "and" where it would also last
function cellName(rc, col) {
  const s = RIFNAME[rc];
  if (col === 'opp') return `${s} but shortest disruption (easier to diversify)`;
  if (col === 'na') return `${s} disruption, duration not assessed`;
  if (col === 'nsc') return `${s} and critical outright: national-security sector`;
  return `${s} ${col === 'low' || col === 'mod' ? 'but' : 'and'} ${CAT[col].disr.toLowerCase()} disruption`;
}
function matrixText(r) {
  return VULN.includes(r.cat) || r.cat === 'opp' ? cellName(r.rc, r.cat) : '';
}

/* ---------- Load ---------- */
// suppliers.json is optional: without it the Observatory works as before, minus the supplier panels
Promise.all([
  fetch('data.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
  fetch('suppliers.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null),
])
  .then(([d, sp]) => { SUP = sp; init(d); })
  .catch(err => {
    $('#app').innerHTML = `<p class="error">Could not load data.json (${esc(err.message)}). Serve this folder over http rather than opening the file directly.</p>`;
  });

function init(d) {
  DATA = d;
  // Supplier fields from BACI (HS6, one calendar year): China's share of global exports, export cover and the
  // number of other exporters with 10% or more of global exports. Without suppliers.json the gate is simply skipped.
  const spOf = hs6 => { const q = sup(hs6); if (!q) return {}; const rest = q.wv * (1 - q.wc / 100);
    const fc = q.iv * q.ic / 100;
    return { sw: q.wc, cv: q.iv > 0 && rest > 0 ? (fc > 0 ? rest / fc : Infinity) : null, wn: q.wn }; };
  ITEMS = d.rows.map(r => {
    const hs6 = r[0].slice(0, 6), ns = !!NS_HEADINGS[r[0].slice(0, 4)], sp = spOf(hs6);
    return { hs8: r[0], hs6, name: r[1], pci: r[2], ns, basket: isBasket(r[0], r[1]), sw: sp.sw ?? null, cv: sp.cv ?? null, wn: sp.wn ?? null,
      y: Object.fromEntries(YEARS.map(y => [y, classify(r, y, { ...sp, ns })])) };
  });
  BY_HS8 = new Map(ITEMS.map(i => [i.hs8, i]));
  BY_HS6 = new Map();
  for (const i of ITEMS) { if (!BY_HS6.has(i.hs6)) BY_HS6.set(i.hs6, []); BY_HS6.get(i.hs6).push(i); }
  // Watch list: acute dependence on a complex product, but too small to pass the RIF threshold
  for (const i of ITEMS) for (const y of YEARS) { const r = i.y[y]; r.watch = r.c > 0 && r.d >= 70 && i.pci != null && i.pci >= 1 && r.rif < TH.RIF_MIN && !r.alt; }
  for (const y of YEARS) STATS[y] = stats(y);
  // Year buttons live in the sidebar, which is redrawn on every page
  document.addEventListener('click', e => { const b = e.target.closest('.seg.years button[data-year]'); if (b) setYear(b.dataset.year); });
  // A link to the page already open still takes the reader to its target (for example, Jump to › Bubble chart twice)
  document.addEventListener('click', e => { const a = e.target.closest('#side a[href^="#"]'); if (a && a.getAttribute('href') === location.hash) { e.preventDefault(); route(); } });
  window.addEventListener('hashchange', route);
  bindBarTips();
  $('#scrim').addEventListener('click', closeDetail);
  // Clicking the title while already on the first page has no hash change, so scroll up by hand
  $('#homeLink').addEventListener('click', () => { if (location.hash === '#overview' || !location.hash) { closeDetail(); S.ch = 0; render(); window.scrollTo(0, 0); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
  if (window.Chart) {
    Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
    Chart.defaults.color = 'rgba(23,20,19,0.70)';
    Chart.defaults.borderColor = 'rgba(23,20,19,0.08)';
  }
  initSearch();
  route();
}

function stats(y) {
  const s = { n: {}, v: {}, china: 0, total: 0, dep30: 0 };
  CAT_ORDER.forEach(c => { s.n[c] = 0; s.v[c] = 0; });
  for (const i of ITEMS) {
    const r = i.y[y];
    s.n[r.cat]++; s.v[r.cat] += r.c; s.china += r.c; s.total += r.t;
    if (r.d >= TH.D_MIN) s.dep30++;
  }
  s.strat = STRAT.reduce((a, c) => a + s.n[c], 0);
  s.stratV = STRAT.reduce((a, c) => a + s.v[c], 0);
  s.crit = CRIT.reduce((a, c) => a + s.n[c], 0);
  s.critV = CRIT.reduce((a, c) => a + s.v[c], 0);
  return s;
}

function setYear(y) {
  S.year = y;
  try { localStorage.setItem('icvm-year', y); } catch (e) {}
  S.mPage = 0; S.ex.page = 0;
  render();
}

const PAGES = {};
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
function route() {
  const [page, qs] = (location.hash.slice(1) || 'overview').split('?');
  // Old links: #matrix opens the verdict chapter; #opportunities opens the Explorer's low-complexity group
  const toMatrix = page === 'matrix';
  const toOpp = page === 'opportunities';
  S.page = toOpp ? 'explorer' : toMatrix ? 'overview' : PAGES[page] ? page : 'overview';
  const p = new URLSearchParams(qs || '');
  if (S.page === 'overview') S.ch = toMatrix ? 6 : Math.max(0, Math.min(CHAPTERS.length - 1, parseInt(p.get('ch'), 10) || 0));
  if (S.page === 'methodology') {
    const s = p.get('s') || (p.get('g') ? 'glossary' : 'about');
    S.mSec = METH.some(x => x.id === s) ? s : 'about';
  }
  if (S.page === 'explorer') {
    const legacy = LEGACY_CAT[p.get('cat')];
    const tab = toOpp ? 'opp' : legacy ? legacy[0] : p.get('tab') || (p.get('q') ? 'all' : 'vuln');
    // Filters travel as th=metric:from:to|metric:from:to; older links used tier= and rc=, which now map onto the same filters
    const th = {};
    const TIERS = { '30plus': ['30', ''], Acute: ['70', ''], Severe: ['70', ''], High: ['50', '70'], Moderate: ['30', '50'], 'Below 30%': ['', '30'] };
    const RCS = { ext: ['1', ''], exp: ['0.1', '1'], sub: ['0.01', '0.1'], ins: ['', '0.01'] };
    if (TIERS[p.get('tier')]) th.d = TIERS[p.get('tier')];
    if (RCS[p.get('rc')]) th.rif = RCS[p.get('rc')];
    for (const part of (p.get('th') || '').split('|')) { const [k, lo, hi] = part.split(':'); if (THK[k]) th[k] = [lo || '', hi || '']; }
    S.ex = { ...S.ex, th, q: p.get('q') || '', tab, band: legacy ? legacy[1] : p.get('band') || '', flag: p.get('flag') || '', page: 0,
             view: p.get('view') === 'chart' ? 'chart' : 'table' };
  }
  closeDetail();
  render();
  window.scrollTo(0, 0);
  // #overview?ch=5&at=matrix|chart lands on the matrix or the bubble chart inside the verdict chapter
  const at = S.page === 'overview' && document.getElementById(({ submatrix: 'subSec', matrix: 'matrixSec', chart: 'verdictChart' })[p.get('at')]);
  // Scroll again once web fonts load, since the text above reflows when they arrive
  if (at) { const go = () => at.scrollIntoView({ block: 'start' }); requestAnimationFrame(go); document.fonts?.ready.then(go); }
  const item = p.get('item');
  if (item && BY_HS8.has(item)) openDetail(item);
  const g = ({ 'immediate-shock-potential': 'scale-of-disruption-immediate-shock' })[p.get('g')] || p.get('g');
  const entry = g && document.getElementById('g-' + g);
  if (entry) { entry.classList.add('hl'); requestAnimationFrame(() => entry.scrollIntoView({ block: 'center' })); }
}

function render() {
  $$('.nav-link').forEach(a => a.classList.toggle('active', a.dataset.page === (S.page === 'author' ? 'about' : S.page)));
  while (charts.length) charts.pop().destroy();
  PAGES[S.page]($('#app'), $('#side'));
  $$('.seg.years button[data-year]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.year === S.year)));
}


/* ---------- Alternative suppliers: CEPII BACI, one calendar year, HS6 ---------- */
const CN = '156';   // China's country code in BACI
function sup(hs6) {
  const h = SUP && SUP.hs6[hs6];
  if (!h) return null;
  if (h._p) return h._p;
  const nm = c => SUP.meta.countries[c] || c;
  const others = h.i.filter(x => x[0] !== CN), wothers = h.w.filter(x => x[0] !== CN);
  const alt = h.iv <= 0 ? 'No data' : h.in >= 3 ? 'Many' : h.in >= 1 ? 'Few' : 'None';
  return (h._p = { ...h, nm, alt, others, wothers, next: others[0] ? { n: nm(others[0][0]), s: others[0][1] } : null });
}
// Export cover: how many times more the rest of the world exports than India buys from China. Bigger means more cover.
function coverOf(cv) {
  if (cv == null) return null;
  const vr = cv === Infinity ? 0 : 100 / cv;   // India's imports from China as a % of export capacity outside China
  return { vr, x: pct(vr) };
}
// Data for the hover popup: the item's own numbers (US$ mn, from BACI)
function ecAttrs(i) {
  const q = sup(i.hs6), e = coverOf(i.cv);
  if (!q || !e) return '';
  return `data-ec="item" data-vr="${e.vr}" data-a="${(q.iv * q.ic / 100).toFixed(2)}" data-b="${(q.wv * (1 - q.wc / 100)).toFixed(2)}"`;
}

function bindBarTips() {

  const show = e => {
    const t = e.target.closest && e.target.closest('.term');
    const seg = !t && e.target.closest && e.target.closest('.stack span[data-tip]');
    const ec = !t && !seg && e.target.closest && e.target.closest('[data-ec]');
    if (t && e.type === 'pointerdown') return;
    if (t) {
      const g = GLOSSARY.find(x => x[0] === TERMS[t.dataset.term]);
      tip.innerHTML = `<b class="tt">${g[0]}</b><em>${g[2]}</em><span>Click to open in Methodology</span>`;

      tip.innerHTML = `<b>${seg.dataset.pct}</b> ${seg.dataset.tip}<span>${seg.dataset.val}</span>`;
      tip.classList.remove('wide', 'ec');
    } else if (ec && SUP) {
      tip.innerHTML = ecTipHTML(ec); tip.classList.add('ec'); tip.classList.remove('wide');
    } else { tip.style.display = 'none'; return; }
    tip.style.display = 'block';
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
    tip.style.left = Math.max(8, x) + 'px';
    let top = e.clientY - tip.offsetHeight - 12;
    if (top < 8) top = e.clientY + 18;
    if (top + tip.offsetHeight > innerHeight - 8) top = Math.max(8, innerHeight - tip.offsetHeight - 8);
    tip.style.top = top + 'px';

  document.addEventListener('pointerdown', show);
  document.addEventListener('scroll', () => { tip.style.display = 'none'; }, { passive: true });
}

const thresholdLines = {
  id: 'thresholds',
  beforeDatasetsDraw(chart) {
    const { ctx, chartArea: a, scales: { x, y } } = chart;
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(23,20,19,0.35)';
    for (const v of [1, 1.25, 1.5, 1.75, 2]) {
      const px = x.getPixelForValue(v);
      if (px > a.left && px < a.right) { ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke(); }
    }
    for (const v of [TH.RIF_MIN, TH.RIF_EXP, TH.RIF_EXT]) {
      const py = y.getPixelForValue(v);
      if (py > a.top && py < a.bottom) { ctx.beginPath(); ctx.moveTo(a.left, py); ctx.lineTo(a.right, py); ctx.stroke(); }
    }
    ctx.restore();
  },
};

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

// The Explorer's chart view: every item in the current selection that has a PCI score and imports from China
function drawScatter(list) {
  if (!window.Chart) { $('.chart-box').innerHTML = '<p class="error">Chart library did not load.</p>'; return; }
  const groups = {};
  for (const i of list) {
    const r = R(i);
    if (r.c <= 0 || i.pci == null) continue;
    (groups[r.cat] ??= []).push({ x: i.pci, y: Math.max(r.rif, 1e-4), r: Math.max(2, Math.min(16, Math.sqrt(r.c) / 6)), hs8: i.hs8 });
  }
  const order = ['below', 'alt', 'opp', 'low', 'mod', 'high', 'vh', 'nsc', 'crit'];
  const datasets = order.filter(c => groups[c]).map(c => ({
    label: CAT[c].label, data: groups[c],
    backgroundColor: hexA(CAT[c].fill, c === 'below' || c === 'alt' ? 0.55 : 0.78),
    borderColor: c === 'below' || c === 'alt' ? 'rgba(23,20,19,0.25)' : CAT[c].fill, borderWidth: 0.6,
  }));
  // Axes fit the current selection, so a filtered view is not squeezed into a corner
  const pts = Object.values(groups).flat();
  const xs = pts.map(d => d.x), ys = pts.map(d => d.y);
  const xMin = pts.length ? Math.max(-3, Math.floor((Math.min(...xs) - 0.1) * 2) / 2) : -3, xMax = pts.length ? Math.min(3, Math.ceil((Math.max(...xs) + 0.1) * 2) / 2) : 3;
  const yMin = pts.length ? Math.max(1e-4, 10 ** Math.floor(Math.log10(Math.min(...ys)))) : 1e-4;
  const yMax = pts.length ? 10 ** Math.ceil(Math.log10(Math.max(...ys) * 1.05)) : 100;
  const ch = new Chart($('#scatter'), {
    type: 'bubble',
    data: { datasets },
    plugins: [thresholdLines],
    options: {
      maintainAspectRatio: false, animation: false,
      scales: {
        x: { type: 'linear', min: xMin, max: xMax, title: { display: true, text: 'Product Complexity Index (PCI)', font: { family: "'Inter', system-ui, sans-serif", size: 11 } },
             ticks: { font: { family: "'Inter', system-ui, sans-serif", size: 10.5 } } },
        y: { type: 'logarithmic', min: yMin, max: yMax, title: { display: true, text: 'Relative Impact Factor (log scale)', font: { family: "'Inter', system-ui, sans-serif", size: 11 } },
             ticks: { font: { family: "'Inter', system-ui, sans-serif", size: 10.5 }, callback: v => Math.abs(Math.log10(v) - Math.round(Math.log10(v))) < 1e-6 ? String(+v.toPrecision(1)) : '' } },
      },
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, boxHeight: 12, font: { size: 12 } } },
        tooltip: {
          backgroundColor: '#171413', cornerRadius: 0, padding: 10, titleFont: { family: "'Inter', system-ui, sans-serif", size: 11.5 },
          callbacks: {
            title: items => { const i = BY_HS8.get(items[0].raw.hs8); return `${i.hs8}  ${i.name.slice(0, 60)}`; },
            label: ctx => { const i = BY_HS8.get(ctx.raw.hs8), r = R(i); return [`China ${usd(r.c)} · dependence ${pct(r.d)}`, `RIF ${rifFmt(r.rif)} · PCI ${pciFmt(i.pci)}`, CAT[r.cat].label]; },
          },
        },
      },
      onClick: (e, els) => { if (els.length) { const p = ch.data.datasets[els[0].datasetIndex].data[els[0].index]; openDetail(p.hs8); } },
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
    },
  });
  charts.push(ch);
}

// Links from earlier versions used ?cat=; map them onto a tab and a complexity chip
const LEGACY_CAT = { vuln: ['vuln', ''], critical: ['critical', ''], crit: ['critical', 'crit'], vh: ['critical', 'vh'], strat: ['strat', ''],
  high: ['strat', 'high'], mod: ['strat', 'mod'], low: ['strat', 'low'], opp: ['opp', ''], na: ['na', ''], alt: ['alt', ''], nsc: ['critical', 'nsc'], below: ['all', ''] };
const exTab = () => XTABS.find(t => t.id === S.ex.tab) || XTABS[0];
// One line of the change panel: verdict stripe, code, short name, and the figure that matters
function miniRow(i, cat, fig, sub) {
  const name = i.name.length > 48 ? i.name.slice(0, 46).trim() + '…' : i.name;
  return `<li data-hs8="${i.hs8}" style="--cc:${CAT[cat].fill === '#ffffff' ? 'var(--ink-20)' : CAT[cat].fill}" title="${esc(i.name)}">

}

// Each metric a threshold can be set on; a threshold keeps items at or above the first box and below the second
const THK = { d: (i, r) => r.d, rif: (i, r) => r.rif, pci: i => i.pci, sw: i => i.sw, cv: i => { const e = coverOf(i.cv); return e ? e.vr : null; }, wn: i => i.wn };
const THROWS = [['d', 'Dependence (%)'], ['rif', 'Scale of disruption (RIF)'], ['pci', 'Complexity (PCI)'], ['sw', "China's share of global exports (%)"], ['cv', "Export cover (%; smaller means more cover)"], ['wn', 'Other exporters with 10% or more (count)']];
const THSET = { d: ['30', ''], rif: ['0.01', ''], pci: ['1', ''], sw: ['30', ''] };
// Quick ranges for each metric: a click fills the two boxes, a second click clears them. Names follow the Methodology.
const FCHIPS = {
  d:   [['30% or more', '30', '', 'Dependence of 30% or more'], ['Moderate 30–50', '30', '50', 'Moderate dependence: 30% to under 50%'], ['High 50–70', '50', '70', 'High dependence: 50% to under 70%'], ['Acute 70+', '70', '', 'Acute dependence: 70% or more'], ['Below 30', '', '30', 'Below the dependence filter']],
  rif: [['Severe 1+', '1', '', 'Severe scale: RIF of 1 or more'], ['Major 0.1–1', '0.1', '1', 'Major scale: RIF 0.1 to under 1'], ['Substantial 0.01–0.1', '0.01', '0.1', 'Substantial scale: RIF 0.01 to under 0.1'], ['Below 0.01', '', '0.01', 'Insignificant: below the RIF threshold']],
  sw:  [['30% or more', '30', '', 'China supplies 30% or more of global exports'], ['30–50', '30', '50', ''], ['50–75', '50', '75', ''], ['75+', '75', '', ''], ['Under 30', '', '30', 'China supplies under 30% of global exports']],
  cv:  [['Under 5%', '', '5', 'India\'s imports are under 5% of export capacity outside China: wide cover'], ['5–25%', '5', '25', ''], ['25–100%', '25', '100', ''], ['100%+', '100', '', 'India buys more from China than everyone else exports']],
  wn:  [['None', '', '1', 'No other country holds 10% or more of global exports'], ['One', '1', '2', ''], ['2 or more', '2', '', '']],
  pci: [['Below 1', '', '1', 'Low complexity'], ['Mild 1–1.25', '1', '1.25', ''], ['Moderate 1.25–1.5', '1.25', '1.5', ''], ['High 1.5–1.75', '1.5', '1.75', ''], ['Very high 1.75–2', '1.75', '2', ''], ['Extremely high 2+', '2', '', '']],
};
const FLAGCHIPS = [['ns', 'Security sector'], ['basket', 'Basket lines'], ['specific', 'No basket lines']];
// One panel, in the order the method works: dependence, scale, substitutability, capability, then flags
const FROWS = [['d', 'Dependence (%)'], ['rif', 'Scale of disruption (RIF)'], ['sw', "China's share of global exports (%)"], ['cv', 'Export cover (%; smaller means more cover)'], ['wn', 'Other exporters with 10% or more (count)'], ['pci', 'Complexity (PCI)']];
function filtersHTML() {
  const row = ([k, l]) => `<div class="th-row" data-k="${k}"><span>${l}</span><input type="number" step="any" inputmode="decimal" aria-label="${esc(l)}, at least" placeholder="at least" data-th="${k}" data-b="0"><input type="number" step="any" inputmode="decimal" aria-label="${esc(l)}, below" placeholder="below" data-th="${k}" data-b="1"></div>
    <div class="th-chips">${FCHIPS[k].map(([t, lo, hi, tip]) => `<button type="button" data-chip="${k}" data-lo="${lo}" data-hi="${hi}"${tip ? ` title="${esc(tip)}"` : ''}>${t}</button>`).join('')}</div>`;
  return `${FROWS.filter(([k]) => SUP || !['sw', 'cv', 'wn'].includes(k)).map(row).join('')}
    <div class="th-row"><span>Flags</span></div>
    <div class="th-chips">${FLAGCHIPS.map(([k, t]) => `<button type="button" data-flag="${k}">${t}</button>`).join('')}</div>
    <button class="btn" id="thDefaults" type="button">Use the method's thresholds</button>
    <p class="th-hint">Filters narrow the group chosen above, so choose All items to test any combination. A filter keeps items at or above the first number and below the second.</p>`;
}
// Keep the boxes and chips in step with the state, without disturbing a box being typed in
function syncFilters() {
  const th = S.ex.th || {};
  $$('.th-row input').forEach(inp => { if (document.activeElement === inp) return; const v = (th[inp.dataset.th] || ['', ''])[+inp.dataset.b]; if (inp.value !== v) inp.value = v; });
  $$('.th-chips button[data-chip]').forEach(b => { const t = th[b.dataset.chip] || ['', '']; b.classList.toggle('on', t[0] === b.dataset.lo && t[1] === b.dataset.hi); });
  $$('.th-chips button[data-flag]').forEach(b => b.classList.toggle('on', S.ex.flag === b.dataset.flag));
}
function exList() {
  const f = S.ex, q = f.q.trim().toLowerCase(), tab = exTab();
  const L = ITEMS.filter(i => {
    const r = R(i);
    if (!tab.test(r)) return false;
    if (f.band && r.cat !== f.band) return false;
    if (f.flag === 'ns' && !i.ns) return false;
    if (f.flag === 'basket' && !i.basket) return false;
    if (f.flag === 'specific' && i.basket) return false;
    for (const k in f.th) {
      const [lo, hi] = f.th[k];
      if (lo === '' && hi === '') continue;
      const v = THK[k](i, r);
      if (v == null) return false;
      if (lo !== '' && v < +lo) return false;
      if (hi !== '' && v >= +hi) return false;
    }
    if (q && !(i.hs8.startsWith(q) || i.name.toLowerCase().includes(q) || (DATA.hs6[i.hs6] || '').toLowerCase().includes(q))) return false;
    return true;
  });
  const key = COLS[f.sort].sort;
  return L.sort((a, b) => {
    // Items without a PCI score stay at the bottom whichever way PCI is sorted
    if (f.sort === 'pci' && (a.pci == null || b.pci == null)) return (a.pci == null) - (b.pci == null);
    const x = key(a, R(a)), y = key(b, R(b));
    return (x < y ? -1 : x > y ? 1 : 0) * f.dir;
  });
}

// Groups in the sidebar; Critical and Strategic open out into their complexity bands
function exTabsHTML() {
  const f = S.ex;
  return XTABS.map(t => {
    const n = ITEMS.filter(i => t.test(R(i))).length, on = t.id === f.tab;
    const bands = on && t.bands.length ? [['', 'All bands', n]].concat(t.bands.map(b => [b, b === 'nsc' ? 'Security sector' : `${COMPLEXITY[b]} complexity`, ITEMS.filter(i => R(i).cat === b).length]))
      .map(([b, l, k]) => `<button type="button" class="band${f.band === b ? ' on' : ''}" data-band="${b}"><span class="st">${l}</span><span class="sc">${int(k)}</span></button>`).join('') : '';
    return `<button type="button" data-tab="${t.id}"${on ? ' class="on" aria-current="true"' : ''}><i class="dot" style="background:${t.fill}"></i><span class="st">${t.label}</span><span class="sc">${int(n)}</span></button>${bands}`;
  }).join('');
}

function exUpdate() {

/* ---------- Methodology ---------- */
// Combined glossary: Kumar 2023 (IPPR) glossary, terms defined in Kumar 2025, and the Observatory's own terms
const GLOSSARY = [
  ['Alternative suppliers', 'Observatory', "Countries other than China that supply a product. For each HS6 product the Observatory shows China's share of global exports, export cover, the next-largest exporters, and India's own suppliers in 2024. China's share and export cover decide the substitutability test. The rest is shown for information."],
  ['Alternatives exist', 'Observatory', "The verdict for an item that clears the dependence filter and the RIF threshold but fails the substitutability test: China supplies under 30% of global exports, and export cover is 5% or less, meaning India's imports from China are no more than a twentieth of what other countries export. The item is set aside and can be reviewed in the Explorer."],
  ['Adversary test', 'Kumar 2023; Kumar 2025', "The first test of the SCV framework: whether the dependence is on an adversary that has both the capability and the willingness to apply economic coercion to secure its strategic interests. The Observatory studies imports from China, an adversary, so every item passes this test by default."],
  ['Basket line', 'Observatory', 'A residual "other" or "others of others" HS8 line. PCI is published only at HS6, so a basket line inherits an average across very different products, and its RIF may reflect the breadth of the basket rather than a single chokepoint. Basket lines are flagged so their verdicts can be read with care.'],
  ['Capability gap', 'Kumar 2023; Kumar 2025', "A test for critical vulnerability: whether the adversary holds a technical lead in a sophisticated or specialised product that cannot be replicated or sourced elsewhere in the short to medium term. It looks at long-term consequences, beyond eighteen months. The Observatory stands in for it with the PCI: a PCI of 1.75 or more passes the test."],
  ['China\'s share of global exports', 'Observatory', "The share of global exports of an HS6 product, by value, that comes from China in the latest year of the supplier data (2024). Items where China supplies under 30% are set aside at the substitutability test, unless export cover keeps them."],
  ['Cascading test', 'Kumar 2023; Kumar 2025', 'A test of the SCV framework: whether weaponising a dependence would cascade into other domestic sectors along the supply chain or beyond. It mainly concerns capital goods and intermediate goods.'],
  ['Critical vulnerability', 'Kumar 2023; Observatory', "A strategic vulnerability of a severe nature that meets either of two conditions: it can have a profound impact on national security, or it results from an enormous capability gap with an adversary that cannot be closed in the foreseeable future and would take decadal effort. In the Observatory: items that clear the dependence, scale and substitutability gates and either have a PCI of 1.75 or more, or sit in a national-security sector, which is critical outright."],
  ['De-risking', 'Kumar 2025', 'Reducing the strategic cost that dependence on an adversary could impose, without cutting off trade altogether: identifying where dependence amounts to a strategic or critical vulnerability, and building alternatives or domestic capacity there first.'],
  ['Dependence', 'Kumar 2023', 'A situation where one party relies on another to carry out business operations, broadly sales and purchases. Dependence can be buyer-based (downstream) or seller-based (upstream). Its degree or severity can create conditions of vulnerability.'],
  ['Dependence (D), percentage', 'Kumar 2025; Observatory', 'Imports from China as a share of India’s total imports of the same item. Graded Moderate (30 to below 50%), High (50 to below 70%) and Acute (70% and above).'],
  ['Dependence filter', 'Kumar 2025', "The first quantitative step. Items where China supplies less than 30% of India's imports are set aside. China makes about 30% of the world's manufactured goods, so a share above 30% means India leans on China more than China's weight in world production explains. Below 30%, India already buys most of the item elsewhere."],
  ['Disruption horizons', 'Kumar 2025; Kumar 2026', 'Short-term means up to 9 months, medium-term about 18 months, and long-term more than 27 months. In between, short to medium-term runs from 9 to 18 months and medium to long-term from 18 to 27 months. When drawn from PCI, these horizons are indicative, not forecasts.'],
  ['Export cover', 'Observatory', "India's imports as a share of global export capacity outside China: (India's imports of the product from China ÷ exports of the product by every country except China) × 100. A small number means the rest of the world could easily cover India's purchases. A large number means it could not. Above 100%, India buys more from China than everyone else exports. At 5% or less, an item where China supplies under 30% of global exports is set aside. It is demonstrated export capacity, meaning what other countries actually export, not spare capacity."],
  ['Duration of disruption', 'Kumar 2025; Kumar 2026; Observatory', 'How long a disruption could last before India finds other supply, as indicated by the Product Complexity Index. Short-term is up to 9 months (PCI 1 to below 1.25). Short to medium-term is 9 to 18 months (1.25 to below 1.5). Medium-term is about 18 months (1.5 to below 1.75). Medium to long-term is 18 to 27 months (1.75 to below 2). Long-term is over 27 months (PCI 2 and above). Below PCI 1, many countries make the product, so the disruption would be the shortest, though switching suppliers still takes some time. These durations are indicative: PCI ranks how hard a product is to replace; it does not forecast recovery time.'],
  ['Geoeconomics', 'Kumar 2023', 'The geostrategic use of economic power: using economic strength to pursue geostrategic interests. Geoeconomic interests are connected with resource management and the inclusion of resources into national economies.'],
  ['Geopolitics', 'Kumar 2023', 'The use of political tools to further geostrategic or national power or interests. Geopolitical interests are connected with the direct or indirect control of territories that contain resources.'],

function storyHTML() {
  const rail = STORY_STAGES.map(([n, d], k) => `<li data-stage="${k}"><b>${n}</b><span>${d}</span></li>`).join('');
  const items = STORY.map((x, k) => `<li class="sm-item" id="sm${k + 1}" data-st="${x.st}">
      <button type="button" class="sm-q" aria-expanded="false" aria-controls="sm${k + 1}a"><span class="sm-n">${k + 1}</span><span class="sm-t">${x.q}</span><span class="sm-c" aria-hidden="true"></span></button>
      <div class="sm-a" id="sm${k + 1}a" hidden>${x.a.map(t => `<p>${t}</p>`).join('')}${x.obs ? `<p class="sm-obs"><span>In the Observatory</span><a href="${x.obs[1]}">${x.obs[0]} →</a></p>` : ''}${k < STORY.length - 1 ? '<button type="button" class="btn sm-next">Next question →</button>' : '<a class="btn primary" href="#methodology?s=framework">Open the method →</a>'}</div></li>`).join('');
  return `<p class="lede">Follow the questions, in order, from a simple case of dependence to a critical vulnerability. Select a question to see the answer.</p>
    <div class="sm" id="storyMap">
      <ol class="sm-rail" aria-label="Where you are in the story">${rail}</ol>
      <p class="sm-tools"><button type="button" class="btn" id="smAll">Show all answers</button></p>
      <ol class="sm-list">${items}</ol>
    </div>
    <p class="cap">Drawn from Amit Kumar, “The Intractable Dilemma” (2026), and Manoj Kewalramani and Amit Kumar, “Self-Strengthening First” (2026). <a href="#methodology?s=sources">Sources</a></p>`;
}
function bindStory(app) {
  const root = $('#storyMap', app);
  if (!root) return;
  const items = $$('.sm-item', root), rail = $$('.sm-rail li', root), all = $('#smAll', root);
  const stage = () => {
    // The rail shows the furthest stage reached by any open question
    const open = items.filter(i => !i.querySelector('.sm-a').hidden).map(i => +i.dataset.st).filter(n => n < 4);
    const at = open.length ? Math.max(...open) : -1;
    rail.forEach((li, k) => { li.classList.toggle('on', k === at); li.classList.toggle('done', k < at); });
    all.textContent = items.every(i => !i.querySelector('.sm-a').hidden) ? 'Hide all answers' : 'Show all answers';
  };
  const set = (item, on) => { item.querySelector('.sm-a').hidden = !on; item.querySelector('.sm-q').setAttribute('aria-expanded', String(on)); item.classList.toggle('open', on); };
  items.forEach((item, k) => {
    item.querySelector('.sm-q').addEventListener('click', () => { set(item, item.querySelector('.sm-a').hidden); stage(); });
    const nx = item.querySelector('.sm-next');
    if (nx) nx.addEventListener('click', () => { const n = items[k + 1]; set(n, true); stage(); n.scrollIntoView({ behavior: 'smooth', block: 'start' }); n.querySelector('.sm-q').focus({ preventScroll: true }); });
  });
  all.addEventListener('click', () => { const on = !items.every(i => !i.querySelector('.sm-a').hidden); items.forEach(i => set(i, on)); stage(); });
  set(items[0], true);
  stage();
}
const METH = [
  { id: 'story', g: 'Start here', t: 'From dependence to critical vulnerability', s: 'Story map', h: () => storyHTML() },
  { id: 'about', g: 'The method', t: 'About this method', s: 'About this method', h: () => `
      <p class="lede">This Observatory draws on three works by Amit Kumar. The first, <a href="${IPPR_URL}" target="_blank" rel="noopener"><em>Defining Strategic and Critical Vulnerabilities in Asymmetrical Trade Interdependence</em></a> (Indian Public Policy Review, 2023), sets out the Strategic and Critical Vulnerability (SCV) framework. The second, <a href="${PAPER_URL}" target="_blank" rel="noopener"><em>De-risking India's Trade with China: Identifying Strategic and Critical Vulnerabilities</em></a> (Takshashila Discussion Document 2025-01), applies that framework to India's imports from China. The third, “The Intractable Dilemma: A Vision for De-risking Trade with China”, is a chapter in <em>Taming the Dragon</em> (Rupa Publications, 2026). It applies the RIF-PCI scale to India's three largest import categories from China and sets out options for de-risking them.</p>
      <div class="callout"><strong>About this methodology.</strong> The method on this page is an improved version of the one that appeared in the original work. It keeps the original framework and adjusts it so that it can be applied to every HS8 line India imports, across four financial years. It also adds further refinements that bring more nuance to the analysis. For this reason, figures and verdicts on this dashboard may differ from those in the original work.</div>
      <p>The method works in three layers. The SCV framework is the theory. A set of measures (dependence, the Relative Impact Factor, China's share of global exports and the Product Complexity Index) puts the framework to work on trade data. A final human examination covers what numbers cannot show.</p>` },
  { id: 'scv', g: 'The method', t: 'The SCV framework', s: 'The SCV framework', h: () => `
      <p>The Strategic and Critical Vulnerability (SCV) framework is the backdrop for everything else on this page. It sets out when a dependence on another country becomes a strategic vulnerability, and when that vulnerability is critical. The framework is theoretical. The rest of the method finds a way to put it to work on trade data.</p>
      <p>The same framework, told as a series of questions with examples, is in the <a href="#methodology?s=story">story map</a>.</p>
      <div class="fig-row">
        <div>
          <p>Not every dependence is a vulnerability, and not every vulnerability is strategic. Dependence becomes a vulnerability when disruptive factors, such as trade barriers or supply shocks, make it unreliable. A vulnerability is strategic when an adversary can exploit it. A critical vulnerability is the most severe kind of strategic vulnerability. The diagram shows each category as a ring inside the one before it.</p>
        </div>
        <figure class="fig fig-circles">
          <img src="img/scv-circles.png" width="553" height="553" alt="Four concentric rings. From outside in: Dependence, Vulnerability, Strategic, and Critical at the centre.">
          <figcaption>Each ring is a subset of the one around it. Source: Kumar (2023).</figcaption>
        </figure>
      </div>
      <h2>The strategic vulnerability test</h2>
      <p>Under the framework, a dependence becomes a strategic vulnerability when an adversary can use it to impose a strategic cost. It does so if it passes the first two tests and either the third or the fourth.</p>
      <ol>
        <li><strong>Adversary test.</strong> Is the dependence on an adversary that has both the capability and the willingness to use economic coercion to secure its strategic interests?</li>
        <li><strong>Substitutability test.</strong> Can existing alternatives replace the supply if needed? The test weighs whether an alternative can scale up to meet demand immediately, and whether the switching cost is economically reasonable.</li>
        <li><strong>Incidence test.</strong> Would losing a finished product badly affect a large share of the population? The test weighs how many people are affected and how much the product matters to them.</li>
        <li><strong>Cascading test.</strong> Would cutting off the supply spread damage to other Indian industries along the supply chain? This mainly applies to capital goods and intermediate goods.</li>
      </ol>
      <h2>The critical vulnerability test</h2>
      <p>A strategic vulnerability becomes a critical vulnerability if it also passes either of two further tests.</p>
      <ol start="5">
        <li><strong>Capability gap.</strong> Does the adversary have a technical lead in a sophisticated or specialised product that no one else can match or supply within 18 months? The substitutability test looks at the short and medium term, up to 18 months. This test looks at the long term, beyond 18 months.</li>
        <li><strong>National security.</strong> Is the dependence in a sensitive sector? These include power grids, communications, satellites, banking and finance, digital infrastructure, and military command, control and surveillance systems (C4ISR). In these sectors, even a short disruption can harm national security.</li>
      </ol>
      <figure class="fig">
        <img src="img/scv-flowchart.png" width="1363" height="766" alt="Flowchart of the SCV framework. Dependence becomes vulnerability through high-probability disruptive factors. The case then passes through the adversary, alternative, incidence and cascading tests to reach strategic vulnerability, and through the national security or capability tests to reach critical vulnerability. Failing a test leads to non-strategic vulnerability.">
        <figcaption>The SCV framework as a flowchart. Each test scores 1 if the case passes and 0 if it fails. The "alternative test" is the substitutability test: if workable alternatives exist (1), the case is a non-strategic vulnerability (NSV). HPDF stands for high-probability disruptive factors, which turn dependence into vulnerability. Source: Kumar (2023).</figcaption>
      </figure>` },
  { id: 'framework', g: 'The method', t: 'From theory to measurement', s: 'From theory to measurement', h: () => `
      <p>The SCV tests are qualitative. Applying them to every item India imports needs a way to approximate them with data that exists for all of those items.</p>
      <p>Some tests are easy to administer. The adversary test is settled by the choice of country. The others are harder. Testing substitutability properly means mapping alternative suppliers and their capacity. Testing incidence means comparing imports with the whole domestic market. Testing the cascading effect means weighing value added and jobs along the supply chain. That data is not public for every HS8 line.</p>
      <p>The Observatory therefore uses measures that stand in for the tests, and then adds a human examination for what is left.</p>
      <div class="scroll-x keytable"><table class="data defs"><thead><tr><th>SCV test</th><th>Measured by</th><th>Left to judgement</th></tr></thead><tbody>

  { id: 'dependence', g: 'The method', t: 'Step 1: Dependence and the Adversary test', s: 'Step 1: Dependence', h: () => `
      <p>The adversary test is passed by default. The Observatory studies imports from China, which it treats as an adversary, so no item is tested on that count. The dependence filter is a separate step.</p>
      <p>Dependence (D) is the share of India's imports of a line that comes from China.</p>
      <p>The filter is set at 30%. China makes about 30% of the world's manufactured goods, by volume and by value. If India's purchases of an item followed China's weight in world production, about 30% would come from China. A share above 30% means India leans on China more than that weight explains. Below 30%, India already buys most of the item elsewhere, so its supply is treated as diversified. For comparison, India's Competition Act treats a market share above 40% as dominant. Lines below 30% are set aside.</p>
      <p>Lines at 30% or above are graded in equal steps of 20 percentage points.</p>
      <div class="scroll-x keytable"><table class="data"><thead><tr><th>Dependence category</th><th>Range</th></tr></thead><tbody>
