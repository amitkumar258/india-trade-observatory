}

/* Data tables */
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-50); text-align: left; padding: 9px 10px; border-top: 2px solid var(--ink); border-bottom: var(--rule);
  white-space: nowrap; background: var(--paper); vertical-align: bottom;
}

/* Explorer controls */
.controls { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; margin-top: 22px; }

.controls input, .controls select, .inline-select {
  width: 100%; font-family: var(--sans); font-size: 14px; color: var(--ink); background: var(--paper);

}

/* Explorer: table with a change panel on the right; the panel drops below on narrower screens */

/* arrows: a line and a head, drawn in CSS; the label sits beside the line */
.sorter .ar { position: relative; display: flex; align-items: center; justify-content: center; color: var(--ink-50); }
.sorter .ar.v { min-height: 46px; flex-direction: column; }
.sorter .ar.v::before { content: ''; flex: 1; width: 2px; background: currentColor; }
.sorter .ar.v::after { content: ''; border: 7px solid transparent; border-top: 9px solid currentColor; border-bottom: 0; }

<script>
/*CORE-START*/
// Thresholds: paper's Section II, with the RIF scale shifted by a factor of 0.1 for HS8 lines
// RIF tiers: Substantial 0.01 to <0.1, Major 0.1 to <1, Severe 1 and above (the paper's own top threshold)
// S_MIN: China's share of global exports below which alternatives exist; CV_MIN: export cover (exports of the product by every country except China, divided by China's exports of it to India) at or above which the rest of the world could easily cover India's purchases
const TH = { D_MIN: 30, RIF_MIN: 0.01, RIF_EXP: 0.1, RIF_EXT: 1, S_MIN: 30, CV_MIN: 20 };
// Financial years, keyed by the year they end; columns hold [total, China] imports in data.json rows
const YEARS = ['2023', '2024', '2025', '2026'];
const YCOL = { '2023': [3, 4], '2024': [5, 6], '2025': [7, 8], '2026': [9, 10] };

function depTier(d) { return d >= 70 ? 'Acute' : d >= 50 ? 'High' : d >= TH.D_MIN ? 'Moderate' : 'Below 30%'; }
function rifClass(r) { return r >= TH.RIF_EXT ? 'ext' : r >= TH.RIF_EXP ? 'exp' : r >= TH.RIF_MIN ? 'sub' : 'ins'; }
// Table 3 bands; below 1 is low-complexity dependence

    <p>Few competitive exporters means few places could step in, and building new capacity elsewhere takes time. It is one of the two measures of the Capability Gap Test, alongside PCI.</p>

function rifTipHTML(el) {

    : `<p>India buys ${usd(c)} of this item from China, and China supplies ${pct(d)} of India's imports of it. The Scale of Disruption is <b>${RIFNAME[rc]}</b>.${ch ? ` Channel: ${ch}.` : ''}</p>`;
  return `<h4>RIF${head ? '' : ': ' + rifFmt(rif)}</h4>${own}
    <h5>How it is calculated</h5>
    <div class="frac"><span class="fr"><span>Imports from China (US$ mn) × Dependence (%)</span><span>10,000</span></span></div>
    <h5>What it tells you</h5>
    <p>RIF is high only when India buys a lot of the item from China and relies on China for most of it. A cut-off would then hit a large part of the economy at once, with little supply to fall back on. It shows the size of the shock, not how long it would last.</p>
    <h5>The tiers</h5>
    <p>Substantial from 0.01 (about US$1 mn at full dependence), Major from 0.1, Severe from 1. Below 0.01 the shock is Insignificant, and the item is not counted as a vulnerability.</p>

    : `<p>India buys <b>${usd(a)}</b> of this product from China. All other countries together export <b>${usd(b)}</b> (${SUP.meta.year}). India's purchases are <b>${pct(vr)}</b> of that. ${read}</p>`;

const TBL_KEYS = () => ['hs8', 'name', 'china', 'd'].concat(SUP ? ['alt', 'cover'] : [], ['rif', 'pci', 'ubq']);
function suppHTML(i) {
  const s = sup(i.hs6);
  if (!s) return '';
  const Y = SUP.meta.year;
  const row = (n, v, cn) => `<div class="sp-row${cn ? ' cn' : ''}"><span title="${esc(n)}">${esc(n)}</span><span class="sp-bar"><i style="width:${Math.min(100, v).toFixed(1)}%"></i></span><b>${pct(v)}</b></div>`;
  const panel = (title, cs, others) => {
    const top = others.slice(0, 4);
    const rest = Math.max(0, 100 - cs - top.reduce((a, x) => a + x[1], 0));
    return `<div><h4>${title}</h4>${row('China', cs, 1)}${top.map(x => row(s.nm(x[0]), x[1])).join('')}${rest >= 0.05 ? row('All others', rest) : ''}</div>`;
  };
  const L = BY_HS6.get(i.hs6) || [];
  const ct = L.reduce((a, x) => a + x.y['2025'].c, 0), tt = L.reduce((a, x) => a + x.y['2025'].t, 0);
  const dep = tt > 0 ? ct / tt * 100 : null;
  const gap = s.iv > 0 && dep != null && Math.abs(s.ic - dep) > 20;
  const nx = s.wothers[0];
  const sum = `<p class="sp-sum"><b>China supplies ${pct(s.wc)} of global exports of this product.</b> ${nx ? `The next-largest exporter, ${esc(s.nm(nx[0]))}, supplies ${pct(nx[1])}. ` : ''}${s.wn === 0 ? 'No other country holds 10% or more of global exports. ' : `Besides China, ${s.wn} ${s.wn === 1 ? 'country holds' : 'countries each hold'} 10% or more of global exports. `}${s.iv <= 0 ? `BACI records no imports of this product by India in ${Y}.` : `India bought ${pct(s.ic)} of it from China in ${Y}; ${s.in === 0 ? 'no other country' : `${s.in} other countr${s.in === 1 ? 'y' : 'ies'}`} provided 10% or more.`}${(() => { const e = coverOf(i.cv); return e ? ` India's imports from China are ${e.x} of export capacity outside China.` : ''; })()}</p>`;
  return `<h3>Biggest suppliers of this product in ${Y}</h3>
    <p class="cap" style="margin:0">HS6 ${i.hs6}. Calendar year ${Y}, the latest year in the source. Shares are of value.</p>
    <div class="sp-cols">${s.iv > 0 ? panel('Where India bought it', s.ic, s.others) : ''}${panel('Who exports it to the world', s.wc, s.wothers)}</div>
    ${sum}
    ${gap ? `<p class="dr-flag bk">BACI and the Commerce data differ here. BACI puts China at ${pct(s.ic)} of India's ${Y} imports of this product, against ${pct(dep)} in the Commerce data above (${FY['2025']}). Read the supplier shares as a guide.</p>` : ''}
    <p class="disclaim">Supplier data are published at HS6 level, so every HS8 line under HS6 ${i.hs6} shows the same suppliers. Source: CEPII BACI, calendar year ${Y}. BACI reconciles exporters' and importers' customs reports, so its figures can differ from the Commerce Ministry's HS8 data above. <a href="#methodology?s=suppliers" target="_blank" rel="noopener">How to read this</a></p>`;
}

function pagerHTML(total, page, size, id) {
  if (total <= size) return total ? `<div class="pager"><span class="count">${int(total)} commodities</span></div>` : '';
  const from = page * size + 1, to = Math.min(total, (page + 1) * size);
  return `<div class="pager"><span class="count">Showing ${int(from)} to ${int(to)} of ${int(total)}</span>
    <span class="btns"><button class="btn" data-pg="${id}" data-d="-1" ${page === 0 ? 'disabled' : ''}>Previous</button>
    <button class="btn" data-pg="${id}" data-d="1" ${to >= total ? 'disabled' : ''}>Next</button></span></div>`;
}

const LIGHT = ['#ffd966', '#ff9900', '#d9d9d9', '#ffffff'];
// One 100% bar with the share printed on each segment wide enough to hold it
function shareBar(parts, total, label, minLabel = 4, k = 'v') {
  const segs = parts.filter(x => x[k] > 0).map(x => {
    const w = x[k] / total * 100;
    const ink = LIGHT.includes(x.fill) ? 'var(--ink)' : '#fff';
    return `<span style="width:${w}%;background:${x.fill};color:${ink}${x.fill === '#ffffff' ? ';outline:1px dashed rgba(23,20,19,0.5);outline-offset:-1px' : ''}" data-tip="${esc(x.label)}" data-pct="${pct(w)}" data-val="${k === 'n' ? `${int(x.n)} items` : `${usd(x.v)} from China`}">${w >= minLabel ? pct(w) : ''}</span>`;
  }).join('');
  const legend = parts.map(x => `<span><i style="background:${x.fill}${x.fill === '#ffffff' ? ';border:1px dashed rgba(23,20,19,0.5)' : ''}"></i><span>${esc(x.label)}</span> <b>${pct(x[k] / total * 100)}</b></span>`).join('');
  return `<div class="stack" role="img" aria-label="${esc(label)}">${segs}</div><div class="legend">${legend}</div>`;
}

    return `${kick(`Change over time · ${FY[f]} to ${FY[l]}`)}
      <h1>Where did vulnerability grow, and in which items?</h1>

const thresholdLines = {
  id: 'thresholds',
  beforeDatasetsDraw(chart) {
    const { ctx, chartArea: a, scales: { x, y } } = chart;
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(23,20,19,0.35)';
    for (const v of [1, 1.25, 1.5, 1.75, 2]) {
      const px = x.getPixelForValue(v);
      if (px > a.left && px < a.right) { ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke(); }
    }
    for (const v of [TH.RIF_MIN, TH.RIF_EXP, TH.RIF_EXT]) {
      const py = y.getPixelForValue(v);
      if (py > a.top && py < a.bottom) { ctx.beginPath(); ctx.moveTo(a.left, py); ctx.lineTo(a.right, py); ctx.stroke(); }
    }
    ctx.restore();
  },
};

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

// The Explorer's chart view: every item in the current selection that has a PCI score and imports from China
function drawScatter(list) {
  if (!window.Chart) { $('.chart-box').innerHTML = '<p class="error">Chart library did not load.</p>'; return; }
  const groups = {};
  for (const i of list) {
    const r = R(i);
    if (r.c <= 0 || i.pci == null) continue;
    (groups[gkey(r) === 'cwatch' ? 'swatch' : gkey(r)] ??= []).push({ x: i.pci, y: Math.max(r.rif, 1e-4), r: Math.max(2, Math.min(16, Math.sqrt(r.c) / 6)), hs8: i.hs8 });
  }
  const order = ['b30g', 'depg', 'na', 'wlg', 'swatch', 'cwatch', 'low', 'mod', 'high', 'cprod', 'vh', 'cubq', 'nsc', 'crit'];
  const datasets = order.filter(c => groups[c]).map(c => ({
    label: CAT[c].label, data: groups[c],
    backgroundColor: hexA(CAT[c].fill === '#ffffff' ? '#d9d9d9' : CAT[c].fill, ['b30g', 'depg', 'wlg', 'na'].includes(c) ? 0.55 : 0.78),
    borderColor: c === 'cprod' || c === 'cubq' ? '#171413' : ['b30g', 'depg', 'wlg', 'na'].includes(c) ? 'rgba(23,20,19,0.25)' : CAT[c].fill, borderWidth: c === 'cprod' || c === 'cubq' ? 1.8 : 0.6,
  }));
  // Axes fit the current selection, so a filtered view is not squeezed into a corner
  const pts = Object.values(groups).flat();
  const xs = pts.map(d => d.x), ys = pts.map(d => d.y);
  const xMin = pts.length ? Math.max(-3, Math.floor((Math.min(...xs) - 0.1) * 2) / 2) : -3, xMax = pts.length ? Math.min(3, Math.ceil((Math.max(...xs) + 0.1) * 2) / 2) : 3;
  const yMin = pts.length ? Math.max(1e-4, 10 ** Math.floor(Math.log10(Math.min(...ys)))) : 1e-4;
  const yMax = pts.length ? 10 ** Math.ceil(Math.log10(Math.max(...ys) * 1.05)) : 100;
  const ch = new Chart($('#scatter'), {
    type: 'bubble',
    data: { datasets },
    plugins: [thresholdLines],
    options: {
      maintainAspectRatio: false, animation: false,
      scales: {
        x: { type: 'linear', min: xMin, max: xMax, title: { display: true, text: 'Product Complexity Index (PCI)', font: { family: "'Inter', system-ui, sans-serif", size: 11 } },
             ticks: { font: { family: "'Inter', system-ui, sans-serif", size: 10.5 } } },
        y: { type: 'logarithmic', min: yMin, max: yMax, title: { display: true, text: 'Relative Impact Factor (log scale)', font: { family: "'Inter', system-ui, sans-serif", size: 11 } },
             ticks: { font: { family: "'Inter', system-ui, sans-serif", size: 10.5 }, callback: v => Math.abs(Math.log10(v) - Math.round(Math.log10(v))) < 1e-6 ? String(+v.toPrecision(1)) : '' } },
      },
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, boxHeight: 12, font: { size: 12 } } },
        tooltip: {
          backgroundColor: '#171413', cornerRadius: 0, padding: 10, titleFont: { family: "'Inter', system-ui, sans-serif", size: 11.5 },
          callbacks: {
            title: items => { const i = BY_HS8.get(items[0].raw.hs8); return `${i.hs8}  ${i.name.slice(0, 60)}`; },
            label: ctx => { const i = BY_HS8.get(ctx.raw.hs8), r = R(i); return [`China ${usd(r.c)} · dependence ${pct(r.d)}`, `RIF ${rifFmt(r.rif)} · PCI ${pciFmt(i.pci)}`, CAT[gkey(r)].label]; },
          },
        },
      },
      onClick: (e, els) => { if (els.length) { const p = ch.data.datasets[els[0].datasetIndex].data[els[0].index]; openDetail(p.hs8); } },
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
    },
  });
  charts.push(ch);
}

const boxLabel = b => `${b[0] === 'L' ? 'meaningful scale' : 'small scale'}, ${b[1] === 'h' ? 'hard' : 'easy'} to replace, ${b[2] === 'h' ? 'hard' : 'easy'} to make`;
const bandLabel = b => BANDL[b] ? BANDL[b] : /^[LS][he][he]$/.test(b) ? boxLabel(b) : TIERB[b] ? `${TIERB[b]} scale` : b === 'nsc' ? 'Security sector' : b === 'cprod' ? 'Production dominance' : b === 'cubq' ? 'Few exporters' : `${COMPLEXITY[b]} complexity`;

// Links from earlier versions used ?cat=; map them onto a tab and a complexity chip

  high: ['strat', 'high'], mod: ['strat', 'mod'], low: ['strat', 'low'], opp: ['onf', ''], na: ['ona', ''], alt: ['wlarge', ''], nsc: ['critical', 'nsc'], below: ['all', ''] };
const EXALIAS = { vuln: 'critical', cwatch: 'wsmall', swatch: 'wsmall', alt: 'wlarge', opp: 'onf', na: 'ona' };
const exTab = () => XTABS.find(t => t.id === (EXALIAS[S.ex.tab] || S.ex.tab)) || XTABS[0];

// Each metric a threshold can be set on; a threshold keeps items at or above the first box and below the second
const THK = { d: (i, r) => r.d, rif: (i, r) => r.rif, pci: i => i.pci, sw: i => i.sw, cv: i => { const e = coverOf(i.cv); return e ? e.vr : null; }, wn: i => i.wn, ubq: i => i.ubq };
const THROWS = [['d', 'Dependence (%)'], ['rif', 'Scale of Disruption (RIF)'], ['pci', 'Complexity (PCI)'], ['sw', "China's share of global exports (%)"], ['cv', "India's imports from China as % of non-China exports (lower means easier to replace)"], ['wn', 'Other exporters with 10% or more (count)']];
const THSET = { d: ['30', ''], rif: ['0.01', ''], pci: ['1', ''], sw: ['30', ''] };
// Quick ranges for each metric: a click fills the two boxes, a second click clears them. Names follow the Methodology.
const FCHIPS = {
  d:   [['30% or more', '30', '', 'Dependence of 30% or more'], ['Moderate 30–50', '30', '50', 'Moderate dependence: 30% to under 50%'], ['High 50–70', '50', '70', 'High dependence: 50% to under 70%'], ['Acute 70+', '70', '', 'Acute dependence: 70% or more'], ['Below 30', '', '30', 'Below the Dependence Filter']],

const FLAGCHIPS = [['ns', 'Security sector'], ['prod', 'Production data'], ['inc', 'Incidence'], ['cas', 'Cascading'], ['basket', 'Basket lines'], ['specific', 'No basket lines']];
// One panel, in the order the method works: dependence, scale, substitutability, capability, then flags
const FROWS = [['d', 'Dependence (%)'], ['rif', 'Scale of Disruption (RIF)'], ['sw', "China's share of global exports (%)"], ['cv', "India's imports from China as % of non-China exports (lower means easier to replace)"], ['wn', 'Other exporters with 10% or more (count)'], ['pci', 'Complexity (PCI)'], ['ubq', 'Competitive exporters (count)']];
function filtersHTML() {

    <div class="th-chips">${FCHIPS[k].map(([t, lo, hi, tip]) => `<button type="button" data-chip="${k}" data-lo="${lo}" data-hi="${hi}"${tip ? ` title="${esc(tip)}"` : ''}>${t}</button>`).join('')}</div>`;

// Keep the boxes and chips in step with the state, without disturbing a box being typed in
function syncFilters() {
  const th = S.ex.th || {};
  $$('.th-row input').forEach(inp => { if (document.activeElement === inp) return; const v = (th[inp.dataset.th] || ['', ''])[+inp.dataset.b]; if (inp.value !== v) inp.value = v; });
  $$('.th-chips button[data-chip]').forEach(b => { const t = th[b.dataset.chip] || ['', '']; b.classList.toggle('on', t[0] === b.dataset.lo && t[1] === b.dataset.hi); });

function exList() {
  const f = S.ex, q = f.q.trim().toLowerCase(), tab = exTab();
  const L = ITEMS.filter(i => {
    const r = R(i);
    if (!tab.test(r)) return false;
    if (f.band && !bandHit(r, f.band)) return false;
    if (f.flag === 'ns' && !i.ns) return false;
    if (f.flag === 'basket' && !i.basket) return false;
    if (f.flag === 'specific' && i.basket) return false;
    if (f.flag === 'prod' && i.prod == null) return false;
    if (f.flag === 'inc' && i.eu !== 'C') return false;
    if (f.flag === 'cas' && !(i.eu === 'I' || i.eu === 'K')) return false;
    for (const k in f.th) {
      const [lo, hi] = f.th[k];
      if (lo === '' && hi === '') continue;
      const v = THK[k](i, r);
      if (v == null) return false;
      if (lo !== '' && v < +lo) return false;
      if (hi !== '' && v >= +hi) return false;
    }
    if (q && !(i.hs8.startsWith(q) || i.name.toLowerCase().includes(q) || (DATA.hs6[i.hs6] || '').toLowerCase().includes(q))) return false;
    return true;
  });

  return L.sort((a, b) => {
    // Items without a PCI score stay at the bottom whichever way PCI is sorted
    if (f.sort === 'pci' && (a.pci == null || b.pci == null)) return (a.pci == null) - (b.pci == null);
    const x = key(a, R(a)), y = key(b, R(b));
    return (x < y ? -1 : x > y ? 1 : 0) * f.dir;
  });
}

/* ---------- Methodology ---------- */
// Combined glossary: Kumar 2023 (IPPR) glossary, terms defined in Kumar 2025, and the Observatory's own terms
const GLOSSARY = [
  ['Alternative suppliers', 'Observatory', "Countries other than China that supply a product. For each HS6 product the Observatory shows China's share of global exports, India's imports from China as a share of non-China exports, the next-largest exporters, and India's own suppliers in 2024. China's share and that share decide the Substitutability Test. The rest is shown for information."],
  ['Alternatives exist', 'Observatory', "The verdict for an item that clears the Dependence Filter but fails the Substitutability Test: China supplies under 30% of world exports, and India's imports from China are 5% or less of non-China exports, no more than a twentieth of what other countries export, so they could replace China easily. The item is set aside. Those whose Scale of Disruption is Severe or Major are graded Vulnerabilities: large shock, shorter disruption."],
  ['Adversary Test', 'Kumar 2023; Kumar 2025', "The first test of the SCV Framework: whether the dependence is on an adversary that has both the capability and the willingness to apply economic coercion to secure its strategic interests. The Observatory studies imports from China, an adversary, so every item passes this test by default."],
  ['Basket line', 'Observatory', 'A residual "other" or "others of others" HS8 line. PCI is published only at HS6, so a basket line inherits an average across very different products, and its RIF may reflect the breadth of the basket rather than a single chokepoint. Basket lines are flagged so their verdicts can be read with care.'],
  ['Capability gap', 'Kumar 2023; Kumar 2025', "A test for Critical Vulnerability: whether the adversary holds a technical lead in a sophisticated or specialised product that cannot be replicated or sourced elsewhere in the short to medium term. It looks at long-term consequences. The Observatory uses two measures, either of which passes the test: a PCI of 1.75 or more, or five or fewer competitive exporters (not applied to consumer goods). Passing it suggests a lead that others would take long to close, so a disruption would likely last longer still."],
  ['China\'s share of global exports', 'Observatory', "The share of global exports of an HS6 product, by value, that comes from China in the latest year of the supplier data (2024). It is the first measure of the Substitutability Test: at 30% or more, the item goes forward. A higher share suggests fewer alternative suppliers, so a disruption would likely last longer."],
  ['Channel: incidence or cascading', 'Observatory', "Where a disruption would land, from the United Nations' Broad Economic Categories (BEC Rev. 5). Consumer goods carry the Incidence Test, because a cut-off reaches households directly. Intermediate and capital goods carry the Cascading Test, because it spreads to the industries that use them. The tag is a label and does not change a verdict."],
  ['Competitive exporters', 'Observatory', "The number of countries that export a product with a revealed comparative advantage of 1 or more: the product's share of the country's exports is at least its share of world trade. Only countries exporting US$1 bn or more a year are counted; BACI, 2022 to 2024. Five or fewer passes the Capability Gap Test, except for consumer goods. The count includes China and does not say who leads. Fewer competitive exporters suggests fewer places could step in, so a disruption would likely last longer."],
  ['Cascading Test', 'Kumar 2023; Kumar 2025', 'A test of the SCV Framework: whether weaponising a dependence would cascade into other domestic sectors along the supply chain or beyond. It mainly concerns capital goods and intermediate goods.'],
  ['Critical Vulnerability', 'Kumar 2023; Observatory', "A Strategic Vulnerability of a severe nature that meets either of two conditions: it can have a profound impact on national security, or it results from an enormous capability gap with an adversary that cannot be closed in the foreseeable future and would take decadal effort. In the Observatory: items that clear the dependence, scale and substitutability gates and pass the Capability Gap Test (a PCI of 1.75 or more, or five or fewer competitive exporters), or sit in a national-security sector, which is critical outright. Until a Human Examination confirms it, it is a potential Critical Vulnerability."],
  ['De-risking', 'Kumar 2025', 'Reducing the strategic cost that dependence on an adversary could impose, without cutting off trade altogether: identifying where dependence amounts to a Strategic or Critical Vulnerability, and building alternatives or domestic capacity there first.'],
  ['Dependence', 'Kumar 2023', 'A situation where one party relies on another to carry out business operations, broadly sales and purchases. Dependence can be buyer-based (downstream) or seller-based (upstream). Its degree or severity can create conditions of vulnerability. In the Observatory, the Dependence grade holds items India buys 30% or more from China that are not graded higher.'],
  ['Dependence (D), percentage', 'Kumar 2025; Observatory', 'Imports from China as a share of India’s total imports of the same item. Graded Moderate (30 to below 50%), High (50 to below 70%) and Acute (70% and above). Higher dependence indicates that India relies more on China for the item.'],
  ['Dependence Filter', 'Kumar 2025', "The first quantitative step. Items where China supplies less than 30% of India's imports are set aside. China makes about 30% of the world's manufactured goods, so a share above 30% means India leans on China more than China's weight in world production explains. Below 30%, India already buys most of the item elsewhere."],
  ['India\'s imports from China as % of non-China exports', 'Observatory', "What India buys of a product from China, as a share of what every other country exports of it: (India's imports from China ÷ exports by every country except China) × 100. Low means other countries already export far more than India buys from China, so a small rise in their exports would replace China. High means they could not. Above 100%, India buys more from China than all other countries export. Where China supplies under 30% of world exports, an item is set aside at 5% or less, about what one good year of export growth adds. These are actual exports, not spare capacity. A higher figure suggests other exporters could not readily cover India's purchases, so a disruption would likely last longer."],
  ['Duration of Disruption', 'Kumar 2025; Observatory', 'How long a disruption could last before India finds other supply. The Observatory reads it from the Substitutability Test: an item that fails the test would take longer to restore; one that passes it, sooner. It is a ranking, not a forecast of time.'],

      <div class="sm-a" id="sm${k + 1}a" hidden>${x.a.map(t => `<p>${t}</p>`).join('')}${x.obs ? `<p class="sm-obs"><span>In the Observatory</span><a href="${x.obs[1]}">${x.obs[0]} →</a></p>` : ''}${k < STORY.length - 1 ? '<button type="button" class="btn sm-next">Next question →</button>' : '<a class="btn primary" href="#methodology?s=framework">Open the method →</a>'}</div></li>`).join('');

function bindStory(app) {
  const root = $('#storyMap', app);

    // The rail shows the furthest stage reached by any open question
    const open = items.filter(i => !i.querySelector('.sm-a').hidden).map(i => +i.dataset.st).filter(n => n < 4);
    const at = open.length ? Math.max(...open) : -1;
    rail.forEach((li, k) => { li.classList.toggle('on', k === at); li.classList.toggle('done', k < at); });
    all.textContent = items.every(i => !i.querySelector('.sm-a').hidden) ? 'Hide all answers' : 'Show all answers';
  };
  const set = (item, on) => { item.querySelector('.sm-a').hidden = !on; item.querySelector('.sm-q').setAttribute('aria-expanded', String(on)); item.classList.toggle('open', on); };
  items.forEach((item, k) => {
    item.querySelector('.sm-q').addEventListener('click', () => { set(item, item.querySelector('.sm-a').hidden); stage(); });
    const nx = item.querySelector('.sm-next');
    if (nx) nx.addEventListener('click', () => { const n = items[k + 1]; set(n, true); stage(); n.scrollIntoView({ behavior: 'smooth', block: 'start' }); n.querySelector('.sm-q').focus({ preventScroll: true }); });
  });
  all.addEventListener('click', () => { const on = !items.every(i => !i.querySelector('.sm-a').hidden); items.forEach(i => set(i, on)); stage(); });

}
const METH = [
  { id: 'story', g: 'Start here', t: 'From dependence to Critical Vulnerability', s: 'Story map', h: () => storyHTML() },
  { id: 'about', g: 'The method', t: 'About this method', s: 'About this method', h: () => `
      <p class="lede">This Observatory draws on three works by Amit Kumar. The first, <a href="${IPPR_URL}" target="_blank" rel="noopener"><em>Defining Strategic and Critical Vulnerabilities in Asymmetrical Trade Interdependence</em></a> (Indian Public Policy Review, 2023), sets out the Strategic and Critical Vulnerability (SCV) framework. The second, <a href="${PAPER_URL}" target="_blank" rel="noopener"><em>De-risking India's Trade with China: Identifying Strategic and Critical Vulnerabilities</em></a> (Takshashila Discussion Document 2025-01), applies that framework to India's imports from China. The third, “The Intractable Dilemma: A Vision for De-risking Trade with China”, is a chapter in <em>Taming the Dragon</em> (Rupa Publications, 2026). It applies the RIF-PCI scale to India's three largest import categories from China and sets out options for de-risking them.</p>
      <div class="callout"><strong>About this methodology.</strong> The method on this page is an improved version of the one that appeared in the original work. It keeps the original framework and adjusts it so that it can be applied to every HS8 line India imports, across four financial years. It also adds further refinements that bring more nuance to the analysis. For this reason, figures and verdicts on this dashboard may differ from those in the original work.</div>
      <p>The method works in three layers. The SCV Framework is the theory. A set of measures puts the framework to work on trade data, in order: dependence; the Relative Impact Factor for scale; China's share of world exports and of world production, and India's imports from China as a share of non-China exports, for substitutability; and the Product Complexity Index, China's production share and the number of competitive exporters for the capability gap. A final Human Examination covers what numbers cannot show.</p>` },
  { id: 'scv', g: 'The method', t: 'The SCV Framework', s: 'The SCV Framework', h: () => `
      <p>The Strategic and Critical Vulnerability (SCV) framework is the backdrop for everything else on this page. It sets out when a dependence on another country becomes a Strategic Vulnerability, and when that vulnerability is critical. The framework is theoretical. The rest of the method finds a way to put it to work on trade data.</p>
      <p>The same framework, told as a series of questions with examples, is in the <a href="#methodology?s=story">story map</a>.</p>
      <div class="fig-row">
        <div>
          <p>Not every dependence is a vulnerability, and not every vulnerability is strategic. Dependence becomes a vulnerability when disruptive factors, such as trade barriers or supply shocks, make it unreliable. A vulnerability is strategic when an adversary can exploit it. A Critical Vulnerability is the most severe kind of Strategic Vulnerability. The diagram shows each category as a ring inside the one before it.</p>
        </div>
        <figure class="fig fig-circles">
          <img src="img/scv-circles.png" width="553" height="553" alt="Four concentric rings. From outside in: Dependence, Vulnerability, Strategic, and Critical at the centre.">
          <figcaption>Each ring is a subset of the one around it. Source: Kumar (2023).</figcaption>
        </figure>
      </div>
      <h2>The Strategic Vulnerability test</h2>
      <p>Under the framework, a dependence becomes a Strategic Vulnerability when an adversary can use it to impose a strategic cost. It does so if it passes the first two tests and either the third or the fourth.</p>
      <ol>
        <li><strong>Adversary Test.</strong> Is the dependence on an adversary that has both the capability and the willingness to use economic coercion to secure its strategic interests?</li>
        <li><strong>Substitutability Test.</strong> Can existing alternatives replace the supply if needed? The test weighs whether an alternative can scale up to meet demand immediately, and whether the switching cost is economically reasonable.</li>
        <li><strong>Incidence Test.</strong> Would losing a finished product badly affect a large share of the population? The test weighs how many people are affected and how much the product matters to them.</li>
        <li><strong>Cascading Test.</strong> Would cutting off the supply spread damage to other Indian industries along the supply chain? This mainly applies to capital goods and intermediate goods.</li>
      </ol>
      <h2>The Critical Vulnerability test</h2>
      <p>A Strategic Vulnerability becomes a Critical Vulnerability if it also passes either of two further tests.</p>
      <ol start="5">
        <li><strong>Capability gap.</strong> Does the adversary have a technical lead in a sophisticated or specialised product that no one else can match or supply soon? The Substitutability Test looks at the short and medium term. This test looks at the long term.</li>
        <li><strong>National security.</strong> Is the dependence in a sensitive sector? These include power grids, communications, satellites, banking and finance, digital infrastructure, and military command, control and surveillance systems (C4ISR). In these sectors, even a short disruption can harm national security.</li>
      </ol>
      <figure class="fig">
        <img src="img/scv-flowchart.png" width="1363" height="766" alt="Flowchart of the SCV Framework. Dependence becomes vulnerability through high-probability disruptive factors. The case then passes through the Adversary, Alternative, Incidence and Cascading Tests to reach Strategic Vulnerability, and through the National Security or Capability Tests to reach Critical Vulnerability. Failing a test leads to non-Strategic Vulnerability.">
        <figcaption>The SCV Framework as a flowchart. Each test scores 1 if the case passes and 0 if it fails. The "alternative test" is the Substitutability Test: if workable alternatives exist (1), the case is a non-Strategic Vulnerability (NSV). HPDF stands for high-probability disruptive factors, which turn dependence into vulnerability. Source: Kumar (2023).</figcaption>
      </figure>` },
  { id: 'framework', g: 'The method', t: 'From theory to measurement', s: 'From theory to measurement', h: () => `
      <p>The SCV tests are qualitative. Applying them to every item India imports needs a way to approximate them with data that exists for all of those items.</p>
      <p>Some tests are easy to administer. The Adversary Test is settled by the choice of country. The others are harder. Testing substitutability properly means mapping alternative suppliers and their capacity. Testing incidence means comparing imports with the whole domestic market. Testing the cascading effect means weighing value added and jobs along the supply chain. That data is not public for every HS8 line.</p>
      <p>The Observatory therefore uses measures that stand in for the tests, and then adds a Human Examination for what is left. Where a test has more than one measure, any one of them is enough. Substitutability follows one rule: an item goes forward if alternatives are not enough and its PCI is 1 or more, or if China makes 50% or more of world output.</p>
      <div class="scroll-x keytable"><table class="data defs"><thead><tr><th>SCV test</th><th>Measured by</th><th>Left to judgement</th></tr></thead><tbody>

        <tr><td><strong>Substitutability</strong></td><td>Fails if alternatives are not enough (China's share of world exports 30% or more, or India's imports from China above 5% of non-China exports) and the PCI is 1 or more; or if China makes 50% or more of world output</td><td>Switching cost, and whether other suppliers are willing to supply India</td></tr>

        <tr><td><strong>National security</strong></td><td>Items in listed national-security sectors are critical outright</td><td>Whether the sector call fits the item</td></tr>
      </tbody></table></div>
      ${(() => { const Pp = ITEMS.filter(i => R(i).cat !== 'below'), cap = i => (i.pci != null && i.pci >= TH3.PCI_CRIT) || (i.ubq != null && i.ubq <= TH3.UBQ && i.eu !== 'C');
        const nA = Pp.filter(i => R(i).cat !== 'alt' && !cap(i)).length, nB = Pp.filter(i => R(i).cat === 'alt' && cap(i)).length;
        return `<h2>Why substitutability and capability are separate tests</h2>
      <p>The two tests can look alike, because both ask whether India could get the product from someone other than China. They ask it over different horizons. Substitutability asks whether existing suppliers could replace China in the short to medium term, at a reasonable switching cost. If imports from China could be replaced quickly, the dependence is not much of a Strategic Vulnerability. The capability gap asks whether anyone could match China's lead even with time, by building new capacity and know-how. It marks the more severe, critical form of vulnerability, where the gap is so large that substitution seems impossible for years. The framework's illustration is photolithography equipment, where the West holds such a lead over China.</p>
      <p>An item can fail one test and pass the other. Chopsticks or umbrella frames come mostly from China, so they go forward on the first part, but their PCI is low, which suggests any country could make them, so the second part of the Substitutability Test sets them aside and there is no capability gap. Some pharmaceutical intermediates are made competitively by only a few countries, a capability gap, but those countries are not China, so alternatives exist.</p>
      <p>In the data, the measures overlap. PCI and the count of competitive exporters are built from who exports what, as substitutability is. The two tests still sort items differently. Of the ${int(Pp.length)} items that pass dependence and scale in ${FY[S.year]}, ${int(nA)} have limited alternatives but no capability gap, and ${int(nB)} have a capability gap but alternatives exist. A disruption lasts as long as the faster of the two routes to new supply takes: existing suppliers expanding, or new capacity being built. That is why the two tests are read together.</p>`; })()}

        <div><div class="k">Part 1 · Quantitative</div><h3>Step 1: Dependence</h3><p>Items where China supplies less than 30% of India's imports are set aside.</p></div>
        <div><div class="k">Part 1 · Quantitative</div><h3>Step 2: Scale of Disruption</h3><p>RIF sorts dependent items by the size of the shock and sets aside items below 0.01. Those that fail the Substitutability Test are graded Vulnerabilities.</p></div>
        <div><div class="k">Part 1 · Quantitative</div><h3>Step 3: Substitutability</h3><p>Items are set aside when other countries could supply them (China under 30% of world exports, and India's purchases small against everyone else's exports) or when their PCI is below 1 (and China makes under 50% of world production). Those with a Severe or Major scale are graded Vulnerabilities.</p></div>
        <div><div class="k">Part 1 · Quantitative</div><h3>Step 4: Capability and national security</h3><p>Passing the Capability Gap Test or the National Security Test makes an item critical. The rest are strategic.</p></div>
        <div style="grid-column: span 2"><div class="k">Part 2 · Qualitative</div><h3>Step 5: Human Examination</h3><p>Each shortlisted item is examined for what the numbers cannot show.</p></div>
      </div>
      <p>The verdicts on this dashboard come from steps 1 to 4. They show which items need attention first under step 5. Scale comes first. Substitutability and capability follow together, because between them they decide whether, and how quickly, supply could be replaced. The SCV Framework lists the Incidence and Cascading Tests after substitutability. The order of measurement differs, but an item must pass every gate, so the order does not change which items pass; it changes only where items are set aside. <a href="#methodology?s=gates">See every gate on one page</a>. The items that pass are potential Strategic or Critical Vulnerabilities until the Human Examination confirms or rejects them.</p>` },
  { id: 'gates', g: 'The method', t: 'Every gate at a glance', s: 'Every gate at a glance', h: () => gatesHTML(S.year) },
  { id: 'dependence', g: 'The method', t: 'Step 1: Dependence and the Adversary Test', s: 'Step 1: Dependence', h: () => `
      <p>The Adversary Test is passed by default. The Observatory studies imports from China, which it treats as an adversary, so no item is tested on that count. The Dependence Filter is a separate step.</p>
      <p>Dependence (D) is the share of India's imports of a line that comes from China.</p>
      <p>The filter is set at 30%. China makes about 30% of the world's manufactured goods, by volume and by value. If India's purchases of an item followed China's weight in world production, about 30% would come from China. A share above 30% means India leans on China more than that weight explains. Below 30%, India already buys most of the item elsewhere, so its supply is treated as diversified. For comparison, India's Competition Act treats a market share above 40% as dominant. Lines below 30% are set aside.</p>
      <p>Lines at 30% or above are graded in equal steps of 20 percentage points.</p>
      <div class="scroll-x keytable"><table class="data"><thead><tr><th>Dependence category</th><th>Range</th></tr></thead><tbody>
        <tr><td>Moderate</td><td class="mono">30 ≤ D &lt; 50</td></tr>
        <tr><td>High</td><td class="mono">50 ≤ D &lt; 70</td></tr>
        <tr><td>Acute</td><td class="mono">D ≥ 70</td></tr>
      </tbody></table></div>
      <p class="cap">Based on Kumar (2025), Table 1.</p>` },
  { id: 'rif', g: 'The method', t: 'Step 2: Scale of Disruption (RIF)', s: 'Step 2: Scale (RIF)', h: () => `
      <p>RIF is an indicator of the <strong>Scale of Disruption (immediate shock)</strong>: how big the disruption would be at once if supply from China stopped. It is applied to every dependent item, before the Substitutability Test.</p>
      <p>RIF indicates scale because a cut-off hurts more when two things are large. The first is the value of imports from China: the more India buys, the larger the part of the economy that relies on that supply. The second is the share of dependence: the higher it is, the more of India's supply is lost at once, and the harder it is to replace quickly. RIF multiplies the two, so it is high only when both are high.</p>
      <p><span class="formula">RIF = Imports from China (US$ mn) × Dependence (%) ÷ 10,000</span></p>
      <p>Dividing by 10,000 only keeps the numbers small. RIF is a relative measure: it shows how the shock compares across lines, not its absolute size.</p>
      <p>RIF lets lines with very different values and dependence be compared. For example, a line with 100% dependence but US$10 mn of imports ranks below a line with 75% dependence and US$50 mn of imports. The second line touches a larger part of the economy.</p>
      <p>HS8 lines are narrow, so a single line can matter even when its value is small. The cut-off at 0.01 keeps every line worth about US$1 mn or more of fully dependent imports. Lines below it are not counted as vulnerabilities; those that fail the Substitutability Test are graded <a href="#methodology?s=watch">vulnerabilities</a>: small shock, longer disruption. Above it, each tier is ten times the one before:</p>
      <ul><li><strong>Substantial (0.01):</strong> about US$1 mn of imports at 100% dependence, or US$3.3 mn at 30%.</li><li><strong>Major (0.1):</strong> about US$10 mn at 100% dependence, or US$33 mn at 30%.</li><li><strong>Severe (1):</strong> about US$100 mn at 100% dependence, or US$333 mn at 30%.</li></ul>
      <div class="scroll-x keytable"><table class="data"><thead><tr><th>Impact factor</th><th>Range</th></tr></thead><tbody>
        <tr><td><span class="sw" style="background:#d9d9d9"></span>Insignificant (not counted)</td><td class="mono">RIF &lt; 0.01</td></tr>
        <tr><td><span class="sw" style="background:#cc0000"></span>Substantial</td><td class="mono">0.01 ≤ RIF &lt; 0.1</td></tr>
        <tr><td><span class="sw" style="background:#94100c"></span>Major</td><td class="mono">0.1 ≤ RIF &lt; 1</td></tr>
        <tr><td><span class="sw" style="background:#5b0f00"></span>Severe</td><td class="mono">RIF ≥ 1</td></tr>
      </tbody></table></div>
      <h2>Incidence or cascading</h2>
      <p>RIF shows how big the shock is. The channel shows where it lands, which is what the Incidence and Cascading Tests ask. Each item is tagged from the United Nations' Broad Economic Categories (BEC Rev. 5), which classify every HS6 product by its main end use.</p>
      <ul>
        <li><strong>Incidence:</strong> consumer goods. A cut-off reaches households directly.</li>
        <li><strong>Cascading:</strong> intermediate goods and capital goods. A cut-off spreads to the industries that use them, and from there to workers and consumers.</li>
        <li><strong>Both:</strong> the few dual-use goods the classification leaves open.</li>
      </ul>
      <p>Nearly all of India's strategic and critical items are inputs or equipment, so its exposure to China runs mainly through cascading. The tag is a label and does not change any verdict. Where a product has several uses, the tag follows the United Nations' assignment of its main use.</p>
      <p class="cap">Based on Kumar (2025), Table 2. End use: UN Statistics Division, HS 2022 to BEC Rev. 5 correspondence.</p>` },
  { id: 'suppliers', g: 'The method', t: 'Step 3: Substitutability', s: 'Step 3: Substitutability', h: () => `
      <p>The Substitutability Test asks whether existing alternatives can replace the supply if needed. The Observatory answers it with data on who exports each product, taken from BACI, the international trade database that CEPII, the French research centre for international economics, builds from customs reports to the United Nations. The Observatory of Economic Complexity draws on the same database. The figures are for ${SUP ? SUP.meta.year : 2024}.</p>
      <p>The Observatory answers it with one rule. An item fails the test, and goes forward, if existing alternatives are not enough <strong>and</strong> its PCI is 1 or more, <strong>or</strong> if China makes 50% or more of world output:</p>
      <p class="formula">[ (China's share of world exports ≥ 30% <b>OR</b> India's imports from China &gt; 5% of non-China exports) <b>AND</b> PCI ≥ 1 ] <b>OR</b> China's share of world production ≥ 50%</p>
      <h2>Part 1: Are alternatives enough?</h2>
      <p>Two measures are used, and either one is enough to send an item to part 2: China's share of world exports (30% or more) or India's imports from China as a share of non-China exports (above 5%). An item is set aside as <strong>alternatives exist</strong> only when both say other countries could supply. Items with no supplier data are not set aside. The test applies to items that passed the Dependence Filter and the RIF threshold. Items set aside with a Severe or Major scale are graded Vulnerabilities: large shock, shorter disruption.</p>
      <h2>China's share of world exports</h2>
      <p>For each HS6 product, this is the share of global exports, by value, that comes from China. Items where China supplies under 30% of world exports are set aside, unless the second measure (below) or China's production share keeps them. China is not a dominant supplier of those products, so other countries already supply most of what the world sells, and India's reliance on China is largely a sourcing choice.</p>
      <p>The 30% line follows the Dependence Filter. China makes about 30% of the world's manufactured goods. A product where China supplies less than that is not concentrated in China at the world level. Where China supplies 30% or more, it is a major or dominant source worldwide, which suggests alternatives are thinner, and the item goes forward.</p>
      <h2>Production share: a route of its own</h2>
      <p>Exports are not production. China may export a modest share of a product yet produce or refine most of the world's supply, because it uses much of the output at home or controls a processing stage that others depend on. China supplies about a fifth of world exports of rare-earth metals but refines about 85% of the world's rare earths. Export data alone would show alternatives that do not exist.</p>
      <p>For the upstream products below, the Observatory uses China's verified share of world production or refining. Each figure is checked against the USGS Mineral Commodity Summaries, the IEA's critical minerals outlook, or an industry body. Figures that could not be verified are left out. Where the share is 50% or more, China makes more than the rest of the world combined, and the item fails the test on that ground alone, whatever its export share, the imports measure or its PCI. PCI misses this too: it rates raw and refined minerals as simple, because many countries export some ore or metal.</p>
      ${M3 ? `<div class="scroll-x keytable"><table class="data"><thead><tr><th>HS6</th><th>Product</th><th class="n">China's share</th><th>Stage</th><th>Source</th></tr></thead><tbody>${Object.entries(M3.prod).sort((x, z) => z[1].share - x[1].share).map(([k, p]) => `<tr><td class="mono">${k}</td><td>${esc(p.material)}</td><td class="n">${nf(p.share, 0)}%</td><td>${esc(p.stage)}</td><td>${esc(p.source)}</td></tr>`).join('')}</tbody></table></div>` : ''}
      <p class="cap">Where a figure comes from a published summary of the source rather than its own table, it is to be confirmed against the table before the method goes live.</p>
      <h2>India's imports from China as % of non-China exports</h2>
      <p>China's share alone can mislead when India buys a lot. China may supply a small share of global exports, yet what India buys from China may be large against what everyone else exports, so other suppliers could not replace it quickly. This is the scalability question in the Substitutability Test, and this measure answers it.</p>
      <p><span class="formula">India's imports from China as % of non-China exports = <span class="frac"><span class="fr"><span>India's imports of the product from China</span><span>Exports of the product by every country except China</span></span><span class="x">× 100</span></span></span></p>
      <p><strong>How to read it.</strong> A <strong>low</strong> figure means other countries already export far more than India buys from China, so a small rise in their exports would replace China. A <strong>high</strong> figure means they could not. At 100%, India buys from China as much as all other countries export put together. Above 100%, it buys more.</p>
      <p><strong>The logic.</strong> Suppose China stopped supplying India. Other countries would have to sell India what it now buys from China. Comparing that amount with what they already export shows how big a job it would be: the figure is the rise in their exports that would be needed.</p>
      <div class="scroll-x keytable"><table class="data"><thead><tr><th>Example, 2024</th><th class="n">India buys from China</th><th class="n">All other countries export</th><th class="n">Share of non-China exports</th><th>Reading</th></tr></thead><tbody>
        <tr><td>Portable computers</td><td class="n">US$5.4 bn</td><td class="n">US$58.9 bn</td><td class="n">9.2%</td><td>Under a tenth of what others export, but almost twice the 5% line: more than a good year's growth.</td></tr>
        <tr><td>Lithium-ion batteries</td><td class="n">US$2.5 bn</td><td class="n">US$49.2 bn</td><td class="n">5.1%</td><td>About a twentieth of what others export, just above the 5% line.</td></tr>
        <tr><td>Embroidery machines</td><td class="n">US$331 mn</td><td class="n">US$419 mn</td><td class="n">79%</td><td>Nearly four-fifths of what others export: they would have to hand over almost everything they sell.</td></tr>
      </tbody></table></div>
      <p>In the Explorer, the column is headed "India's imports from China, as % of non-China exports". Hovering over the heading explains it; hovering over a figure shows that item's own numbers and what they mean.</p>
      <p>The 5% line is the one the substitutability gate uses. If China supplies under 30% of world exports, an item is set aside only when India's imports from China are 5% or less of non-China exports. Above 5%, it goes forward.</p>
      <h2>Why the line is 5%</h2>
      <p>The line has to be set by how much more other exporters could realistically sell in a year. If China stopped supplying India, the only quick way to cover India's purchases is for other countries to export more. India's imports from China as a share of non-China exports is the size of that increase. At 5%, other countries would have to raise their exports of the product by 5% above what they sell today. At 10%, by 10%. So the question is what a year of expansion normally looks like.</p>
      <p>Three checks give the answer.</p>
      <ul>
        <li><strong>Products.</strong> The Observatory compared exports of every country except China, product by product, across the 4,440 HS6 products in its data, using BACI for 2022, 2023 and 2024. In those two annual changes, six in ten products saw exports stay flat or fall. About 27% grew by more than 5% in a year, about 17% by more than 10%, and about 9% by more than 20% (by quantity, products with over US$10 million of exports). A 5% rise is therefore what a good year looks like for a product, 10% is a strong year, and 20% is exceptional.</li>
        <li><strong>World trade.</strong> The WTO puts growth in the volume of world merchandise trade at 2.9% in 2024.</li>
        <li><strong>Factory capacity.</strong> The United States Federal Reserve estimates that US manufacturing capacity grew about 0.5% a year from 2022 to 2025, against a long-run average of about 2%.</li>
      </ul>
      <p>The last two are aggregates and the first is the product level, but all three say the same thing: expansion of 5% in a year is ordinary at best, and expansion of 10% is unusual.</p>
      <h2>Why 5% and not 10%</h2>
      <p>The line decides which items are set aside, and setting an item aside is a claim that alternatives exist. That claim should hold in an ordinary good year, not only in an unusually strong one. At 5% it does: an item is set aside only if a normal year of expansion would cover India's purchases. At 10% the claim would rest on a year that only about one product in six manages.</p>
      <p>Four further points favour the stricter line.</p>
      <ul>
        <li><strong>The growth is not all for India.</strong> New exports go to every buyer, and other buyers' demand grows too. Only part of any increase would be available to India.</li>
        <li><strong>A halt would be sudden.</strong> New factories and mines take years to build. In the first year, other exporters would mostly have to stretch existing capacity.</li>
        <li><strong>The costs are not equal.</strong> Setting an item aside wrongly removes a real vulnerability from view. Letting an item go forward unnecessarily costs a Human Examination in the last step, which is built to deal with it.</li>
        <li><strong>The next step can correct the line.</strong> Items that go forward are still tested for complexity, and every vulnerable item is examined case by case.</li>
      </ul>
      <p>The table shows what the choice does, for FY 2025-26 (the figures move a little with the data).</p>
      <div class="scroll-x keytable"><table class="data"><thead><tr><th>Line</th><th>An item is set aside if</th><th class="n">Products that grew this much in a year</th><th class="n">Items going forward</th><th class="n">Strategic and critical</th></tr></thead><tbody>
        <tr><td><strong>5% (used)</strong></td><td>a good year of expansion would cover it</td><td class="n">27%</td><td class="n">1,211</td><td class="n">234</td></tr>
        <tr><td>10%</td><td>a strong year would cover it</td><td class="n">17%</td><td class="n">1,120</td><td class="n">201</td></tr>
        <tr><td>20%</td><td>an exceptional year would cover it</td><td class="n">9%</td><td class="n">1,099</td><td class="n">194</td></tr>
      </tbody></table></div>
      <p>Moving from 5% to 10% sets aside 91 more items, and 33 fewer end up strategic or critical. The distribution of this measure has no natural break, so the line is a judgment. It is a reasoned first value, not a measured constant, and the Explorer lets you test others.</p>
      <p><strong>What the evidence cannot show.</strong> It rests on two annual changes, both in a weak period for world trade, and product-level figures are noisy. Growth in exports is also not spare capacity: it shows what exporters did sell, not what they could have sold. It is a guide to what expansion is realistic, not a forecast of what a country would supply to India.</p>
      <p>This is demonstrated export capacity: what other countries actually export. It is not spare capacity. A low number shows that other countries sell a lot of the product. It does not show that they have room to sell more to India.</p>
      <h2>Other exporters</h2>
      <p>The number of countries other than China that each hold 10% or more of global exports. It shows how deep the alternatives run. It does not set items aside. The item panel states it, and the Explorer's threshold panel lets you filter on it.</p>
      <h2>What the measures cover</h2>
      <p>The framework describes three ways the Substitutability Test can be failed. There may be no alternative at all. Alternatives may exist but be too small to meet the demand quickly. Or switching may cost too much. China's share and the number of other exporters speak to the first. India's imports from China as a share of non-China exports speaks to the second. The third cannot be measured from trade data and goes to the Human Examination.</p>
      <h2>What to keep in mind</h2>
      <ul>
        <li><strong>HS6 only.</strong> BACI is published at HS6, so every HS8 line under an HS6 product shows the same suppliers.</li>
        <li><strong>One calendar year.</strong> BACI covers calendar years and runs about a year behind. The figures refer to ${SUP ? SUP.meta.year : 2024} whichever financial year is selected, so the substitutability gate does not change from year to year.</li>
        <li><strong>A different source.</strong> BACI reconciles exporters' and importers' customs reports and adjusts for freight and insurance, so its figures differ from the Commerce Ministry's HS8 data. They are usually close. Where China's share of India's imports differs by more than 20 percentage points, the item page says so.</li>
        <li><strong>Exports are not production.</strong> The production share corrects this for 38 upstream products. For other products, China's export share can still understate its position where China uses much of what it makes, or controls an input that others need.</li>
        <li><strong>Supply is not willingness.</strong> A country that exports a product may lack spare capacity, may be bound by sanctions or its own export controls, or may not sell to India.</li>
        <li><strong>Trading hubs.</strong> Hong Kong, Singapore and similar hubs can appear as suppliers of goods made elsewhere, including in China.</li>
        <li><strong>Taiwan.</strong> BACI records Taiwan as “Other Asia, nes”. It is shown here as Taiwan.</li>
        <li><strong>No supplier data.</strong> A few items have no record in BACI. They are not set aside. They are shown as not assessed so that they can be reviewed.</li>
      </ul>
      <h2>Part 2: Is the PCI 1 or more?</h2>
      <p>An item can go forward on the first part and still have a low PCI, which suggests it is easier to make. Where many countries have the know-how, new suppliers can emerge, so a disruption would be shorter. The second part asks whether its <a href="#methodology?s=pci">PCI</a> is 1 or more. Below 1, unless China makes 50% or more of world output, the item is set aside as <strong>low-complexity dependence</strong>. Items with no PCI score cannot be tested, and are shown as <strong>not assessed</strong>.</p>
      <p>Items set aside in either part with a Severe or Major scale are graded Vulnerabilities: large shock, shorter disruption. Items that fail the test, by the two parts or by production share, go on to <a href="#methodology?s=pci">Step 4</a>.</p>` },
  { id: 'pci', g: 'The method', t: 'Step 4: Capability gap', s: 'Step 4: Capability', h: () => `
      <p>The Capability Gap Test asks whether China holds a lead in making the product that others could not close soon. It applies only to items that fail the Substitutability Test. The Observatory uses two measures. An item that passes either one is critical, as is an item in a <a href="#methodology?s=security">national-security sector</a>. The rest are strategic.</p>
      <div class="scroll-x keytable"><table class="data defs"><thead><tr><th>Measure</th><th>Passes at</th><th>Why it signals a gap</th></tr></thead><tbody>
        <tr><td><strong>Product Complexity Index (PCI)</strong></td><td class="mono">1.75 or more</td><td>Only a few advanced economies have the know-how to make the product.</td></tr>
        <tr><td><strong>Competitive exporters</strong></td><td class="mono">5 or fewer</td><td>Only a handful of countries export the product competitively, so few places could step in. Not applied to consumer goods.</td></tr>
      </tbody></table></div>
      <p>PCI is also used one step earlier, in the second part of the <a href="#methodology?s=suppliers">Substitutability Test</a>: a PCI of 1 or more is its second part. Items with a PCI below 1 are set aside there as <strong>low-complexity dependence</strong>, unless China makes 50% or more of world output, and items with no PCI score as <strong>not assessed</strong>.</p>
      <h2>Product Complexity Index</h2>
      <p>PCI was developed by Hidalgo and Hausmann (2009). It ranks products by how much know-how is needed to make them. A product scores high when only a few advanced economies can make it.</p>
      <p>Scores range roughly from -3 to +3. Raw materials and farm goods score lowest. Machinery, electronics and chemicals score highest.</p>
      <p>Scores come from the Observatory of Economic Complexity, at HS6 level (HS 2022 series, 2024). Each HS8 line takes the score of its HS6 code. Where an HS6 code has no score, the Observatory estimates it as the average PCI of the scored products in the same HS4 heading, or failing that the same HS2 chapter. Estimated scores are marked in the Explorer, and are rougher than published ones.</p>
      <div class="callout"><strong>Why HS8 items take an HS6 score.</strong> PCI is calculated only down to HS6, the most detailed level at which it is published. One option was to run the whole study at HS6, but that would still give every product in an HS6 category the same score. Instead, each HS8 item takes the PCI of its HS6 category, while the Dependence Filter and the RIF threshold are applied to each HS8 item on its own. This has three advantages. Each item is judged on its own imports and its own dependence on China. Items whose own RIF falls below 0.01 are set aside, even when their HS6 category as a whole would pass. And HS8 describes each item more precisely than HS6, so it is clear exactly what the item is.</div>
      <div class="scroll-x keytable"><table class="data"><thead><tr><th>Complexity</th><th>Range</th></tr></thead><tbody>
        <tr><td>${swatch('low')}Mild</td><td class="mono">1 ≤ PCI &lt; 1.25</td></tr>
        <tr><td>${swatch('mod')}Moderate</td><td class="mono">1.25 ≤ PCI &lt; 1.5</td></tr>
        <tr><td>${swatch('high')}High</td><td class="mono">1.5 ≤ PCI &lt; 1.75</td></tr>
        <tr><td>${swatch('vh')}Very High</td><td class="mono">1.75 ≤ PCI &lt; 2</td></tr>
        <tr><td>${swatch('crit')}Extremely High</td><td class="mono">PCI ≥ 2</td></tr>
      </tbody></table></div>
      <p class="cap">Based on Kumar (2025), Table 3, and Kumar (2026), Table 3.2.</p>
      <p>Below a PCI of 1, many countries have the know-how to make the product. From 1 upward, the scale is cut into equal steps of 0.25, from Mild to Extremely High. A PCI of 1 or more is the second part of the Substitutability Test (Step 3), and 1.75 or more passes the Capability Gap Test (Step 4).</p>
      <h2>China's production share</h2>
      <p>PCI is built from who exports what, so it can rate a product as simple when China dominates it through scale, cost or a processing stage. Rare-earth magnets have a PCI of about 0.4, yet China makes over 90% of them. Where China's verified share of world production or refining is 50% or more, China makes more than the rest of the world combined, and the item fails the Substitutability Test whatever its PCI. Production share is not a capability gap measure: it marks China's hold on supply, not a technical lead, so it is used only in the <a href="#methodology?s=suppliers">Substitutability Test</a>, where the products and sources are listed.</p>
      <h2>Competitive exporters</h2>
      <p>A country counts as a competitive exporter of a product when the product's share of its exports is at least the product's share of world trade: a revealed comparative advantage of 1 or more. Only countries exporting US$1 bn or more a year are counted, so that very small economies do not distort the count. The figures are an average for 2022 to 2024, from BACI.</p>
      <p>Few competitive exporters means few countries make the product at world-competitive levels, which suggests few places could step in quickly. The count includes China and does not say who leads, so items that pass only on this measure are checked in the Human Examination. Consumer goods are excepted, because few exporters there usually reflects specialisation, not scarce know-how.</p>
      <div class="callout"><strong>Complexity and duration.</strong> The PCI bands above describe how hard a product is to make. They are not a forecast of how long a disruption would last. The method reads duration from the Substitutability Test: an item that fails it would take longer to restore.</div>` },
  { id: 'matrix', g: 'The method', t: 'Putting it together: sorting and verdicts', s: 'Sorting and verdicts', h: () => {
    const st = STATS[S.year], n = c => st.n[c] || 0;
    return `
      <p>Two views show how the items are graded: the substitutability sorting and the verdict.</p>
      <h2>The substitutability sorting</h2>
      <p>The substitutability page sorts each item that clears the Dependence Filter and the RIF threshold into seven boxes: first by China's production share where it is 50% or more, then by China's share of world exports and, for items under 30%, by India's imports from China as a share of non-China exports. Scale of Disruption is not used: RIF has already been applied and plays no part in this test.</p>
      <div class="scroll-x keytable"><table class="data"><thead><tr><th>Box</th><th>China's share of world exports</th><th>What happens</th></tr></thead><tbody>
        <tr><td><span class="sw" style="background:var(--c-alt)"></span>Set aside</td><td class="mono">Under 30%, and India's imports from China 5% or less of non-China exports</td><td>Alternatives exist. The item is set aside; with a Severe or Major scale it is graded a Vulnerability.</td></tr>
        <tr><td><span class="sw" style="background:#d9c7a0"></span>Goes forward: others could not replace it quickly</td><td class="mono">Under 30%, and India's imports from China above 5% of non-China exports</td><td>Other countries' exports barely cover India's purchases. The item goes forward.</td></tr>
        <tr><td><span class="sw" style="background:#e8c6d6"></span>30 to 50%</td><td class="mono">30% ≤ share &lt; 50%</td><td>China is a major supplier to the world. The item goes forward.</td></tr>
        <tr><td><span class="sw" style="background:#b86a93"></span>50 to 75%</td><td class="mono">50% ≤ share &lt; 75%</td><td>China dominates world exports. The item goes forward.</td></tr>
        <tr><td><span class="sw" style="background:#620d3c"></span>75% or more</td><td class="mono">share ≥ 75%</td><td>China is almost the only supplier. The item goes forward.</td></tr>
        <tr><td><span class="sw" style="background:#3d0826"></span>Production dominance</td><td class="mono">China makes 50% or more of world output, whatever its export share</td><td>Fails the Substitutability Test on that ground alone. The item goes forward.</td></tr>
        <tr><td><span class="sw" style="background:#fff;border:1px dashed rgba(23,20,19,0.5)"></span>No supplier data</td><td class="mono">Not assessed</td><td>The item is not set aside, so that it can be reviewed.</td></tr>
      </tbody></table></div>
      <h2>The verdict</h2>
      <p>Only the items carried forward after the Substitutability Test receive a verdict. These are items with 30% or more dependence on China and an RIF of 0.01 or more that fail the Substitutability Test: alternatives are not enough and the PCI is 1 or more, or China makes 50% or more of world output. Step 4 then sorts each one as critical or strategic. The counts are for ${FY[S.year]}.</p>
      <div class="scroll-x keytable"><table class="data defs"><thead><tr><th>Verdict</th><th>Rule, for items carried forward</th><th class="n">Items</th></tr></thead><tbody>
        <tr><td>${swatch('crit')}<strong>Critical Vulnerability</strong></td><td>Passes the Capability Gap Test (a PCI of 1.75 or more, or five or fewer competitive exporters, not applied to consumer goods) or the National Security Test (a listed HS4 heading)</td><td class="n">${int(st.crit)}</td></tr>
        <tr><td>${swatch('high')}<strong>Strategic Vulnerability</strong></td><td>Every other item carried forward: a PCI of 1 to below 1.75, or a lower PCI with China making 50% or more of world output</td><td class="n">${int(st.strat)}</td></tr>
      </tbody></table></div>
      <p>Items set aside earlier receive no verdict. Those below 30% dependence are in Others. Those with an RIF below 0.01, or set aside at the Substitutability Test, are graded <a href="#methodology?s=watch">vulnerabilities or dependence</a>. Of the items with a meaningful shock, ${int(n('alt'))} were set aside because alternatives exist and ${int(n('opp'))} because their PCI is below 1; ${int(n('na'))} have no PCI score and are not assessed. <a href="#methodology?s=gates">Every gate at a glance</a> shows the whole flow.</p>`; } },
  { id: 'verdicts', g: 'The method', t: 'Strategic and Critical Vulnerability', s: 'Strategic and critical', h: () => `
      <p>Each verdict has two definitions. The SCV Framework gives a qualitative definition. The measures give a quantitative one. This dashboard computes the quantitative definition for every item. The shortlisted items are then examined against the qualitative definition.</p>
      <div class="scroll-x keytable"><table class="data defs"><thead><tr><th></th><th>Qualitative: SCV Framework</th><th>Quantitative: the Observatory's measures</th></tr></thead><tbody>
        <tr><td><strong>Strategic Vulnerability</strong></td>
          <td>A vulnerability that an adversary could exploit for strategic ends, through economic coercion, with likely geopolitical or geoeconomic costs for India. A dependence is a Strategic Vulnerability if it passes the Adversary and Substitutability Tests, and either the Incidence or the Cascading Test.</td>
          <td>Dependence on China of 30% or more; an RIF of 0.01 or more; fails the Substitutability Test: alternatives not enough (China supplies 30% or more of world exports, or India's imports from China are more than 5% of non-China exports) and a PCI of 1 or more, or China making 50% or more of world output; no capability gap, and not in a security sector.</td></tr>
        <tr><td><strong>Critical Vulnerability</strong></td>
          <td>A Strategic Vulnerability that also passes the Capability Gap Test or the National Security Test. The adversary's technical lead cannot be matched soon, or the dependence lies in a sensitive sector.</td>
          <td>The same gates, and the Capability Gap Test (a PCI of 1.75 or more, or five or fewer competitive exporters, not applied to consumer goods) or the National Security Test (a listed HS4 heading).</td></tr>
      </tbody></table></div>
      <p>The Capability Gap Test asks whether China holds a lead in making the product that others, including India, could not close soon. A PCI of 1.75 or more marks know-how that only a few advanced economies have. Five or fewer competitive exporters marks a capability that few countries have. China's production share is different: it marks China's hold on supply, not a technical lead, so it is used in the Substitutability Test (50% or more makes an item fail it), not as a capability gap measure.</p>
      <p>Items in national-security sectors are critical once they pass the earlier gates, including both parts of the Substitutability Test. The sector list applies to whole HS4 headings, so it also brings in generic parts, and the Human Examination checks each flagged item.</p>
      <p>The items that pass are <strong>potential Strategic or Critical Vulnerabilities</strong>. A final Human Examination confirms or rejects each one, because some, such as simple consumer goods, can pass the measures without being a real Strategic Vulnerability. Items that fall outside on a single test, small in scale but failing the Substitutability Test, or large in scale but passing it, are graded <a href="#methodology?s=watch">vulnerabilities</a>.</p>` },
  { id: 'human', g: 'The method', t: 'Step 5: Human Examination', s: 'Step 5: Human Examination', h: () => `
      <p>The numbers shortlist items. They cannot decide them. Every item that goes forward needs a Human Examination, and some items that were set aside deserve a second look.</p>
      <h2>What the examination covers</h2>
      <ul>
        <li><strong>Incidence.</strong> How many people would be affected, and how much the product matters to them. RIF shows only the size of the shock.</li>
        <li><strong>Cascading.</strong> Whether a disruption would spread to other industries along the supply chain, judged by value added and jobs.</li>
        <li><strong>Switching cost.</strong> Whether alternatives could supply India at a reasonable cost and in time.</li>
        <li><strong>National security.</strong> Whether the item really serves a sensitive sector. The list works by whole HS4 headings, so it also flags some consumer goods.</li>
        <li><strong>Capability gap.</strong> Whether China truly holds the lead, or the know-how is simply rare. Items that pass only because few countries export them need a check that China is among the few, and that the product is not a craft or decorative good.</li>
      </ul>
      <h2>Items set aside that deserve a second look</h2>
      <ul>
        <li><strong>Alternatives exist.</strong> Outside the 38 products with a production share, China's export share can understate its position where China uses much of what it makes, or controls an input that others need.</li>
        <li><strong>Low-complexity dependence where China dominates.</strong> A low PCI means the know-how is widespread. It does not mean others supply the product at scale.</li>
        <li><strong>The vulnerabilities (watchlist).</strong> Items small in scale that fail the Substitutability Test, and items large in scale that pass it.</li>
        <li><strong>Basket lines.</strong> Residual lines whose PCI averages very different products.</li>
      </ul>
      <p>The Explorer shows every set-aside group, with all the measures beside each item, and lets you set your own thresholds to test other lines.</p>` },
  { id: 'data', g: 'Reference', t: 'Data', s: 'Data', h: () => `
      <p>The trade data covers India's total imports and its imports from China for four financial years, FY 2022-23 to FY 2025-26. It comes from the Ministry of Commerce and Industry.</p>
      <p>Goods are classified under the Harmonised System (HS), which has four levels. HS2 is the broadest. HS4 is in between. HS6 and HS8 describe individual goods in the most detail.</p>
      <p>The Observatory works at HS8, the most detailed level India reports. It tests all ${int(ITEMS.length)} lines. This means a single, highly dependent line cannot hide inside a broader group.</p>
      <p>A few HS8 codes were revised between these years. A line that exists only in the earlier or the later years shows no imports in the years where its code does not exist.</p>
      <h2>Other data</h2>
      <ul>
        <li><strong>Suppliers and competitive exporters:</strong> BACI, CEPII's database of world trade at HS6. China's share of global exports and the share of non-China exports use ${SUP ? SUP.meta.year : 2024}. The count of competitive exporters uses the average of 2022 to 2024.</li>
        <li><strong>Production shares:</strong> USGS Mineral Commodity Summaries 2026, the IEA's Global Critical Minerals Outlook (2025 and 2026) and industry bodies, for 38 upstream HS6 products. Listed under <a href="#methodology?s=suppliers">Step 3</a>.</li>
        <li><strong>End use:</strong> the UN Statistics Division's correspondence from HS 2022 to the Broad Economic Categories (BEC Rev. 5).</li>
        <li><strong>Product complexity:</strong> the Observatory of Economic Complexity, HS6, 2024 scores.</li>
      </ul>` },
  { id: 'security', g: 'Reference', t: 'National-security sectors', s: 'National-security sectors', h: () => `
      <p>Because the National Security Test has no number behind it, the Observatory marks items in the HS4 headings listed below and treats them as critical outright. These headings serve sectors the SCV Framework names, such as power grids, communications, digital infrastructure and C4ISR. They also cover the signalling systems that run transport networks.</p>
      <p>A flagged item that clears the dependence, scale and substitutability gates is critical outright, whatever its other measures. That includes items that would otherwise be low-complexity dependence. The list is indicative. It applies to whole headings, so it also flags some consumer goods, and generic parts such as relays, LEDs and junction boxes. The Human Examination checks each one.</p>
      <div class="scroll-x keytable"><table class="data"><thead><tr><th>HS4</th><th>Heading</th></tr></thead><tbody>
