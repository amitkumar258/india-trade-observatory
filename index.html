      </tbody></table></div>
      <p class="cap">Based on Kumar (2025), Table 1.</p>` },
  { id: 'rif', g: 'The method', t: 'Step 2: Scale of disruption (RIF)', s: 'Step 2: Scale (RIF)', h: () => `
      <p>RIF is an indicator of the <strong>scale of disruption (immediate shock)</strong>: how big the disruption would be at once if supply from China stopped.</p>
      <p>RIF indicates scale because a cut-off hurts more when two things are large. The first is the value of imports from China: the more India buys, the larger the part of the economy that relies on that supply. The second is the share of dependence: the higher it is, the more of India's supply is lost at once, and the harder it is to replace quickly. RIF multiplies the two, so it is high only when both are high.</p>
      <p><span class="formula">RIF = Imports from China (US$ mn) × Dependence (%) ÷ 10,000</span></p>
      <p>Dividing by 10,000 only keeps the numbers small. RIF is a relative measure: it shows how the shock compares across lines, not its absolute size. It does not capture knock-on effects.</p>
      <p>RIF lets lines with very different values and dependence be compared. For example, a line with 100% dependence but US$10 mn of imports ranks below a line with 75% dependence and US$50 mn of imports. The second line touches a larger part of the economy.</p>
      <p>A larger RIF is assumed to mean wider effects on consumers and on other industries. RIF is the closest available stand-in for the incidence and cascading tests.</p>
      <p>HS8 lines are narrow, so a single line can matter even when its value is small. The cut-off at 0.01 keeps every line worth about US$1 mn or more of fully dependent imports, and sets aside only the smallest. Above it, each tier is ten times the one before:</p>
      <ul><li><strong>Substantial (0.01):</strong> about US$1 mn of imports at 100% dependence, or US$3.3 mn at 30%.</li><li><strong>Major (0.1):</strong> about US$10 mn at 100% dependence, or US$33 mn at 30%.</li><li><strong>Severe (1):</strong> about US$100 mn at 100% dependence, or US$333 mn at 30%.</li></ul>
      <div class="scroll-x keytable"><table class="data"><thead><tr><th>Impact factor</th><th>Range</th></tr></thead><tbody>
        <tr><td><span class="sw" style="background:#d9d9d9"></span>Insignificant (set aside)</td><td class="mono">RIF &lt; 0.01</td></tr>
        <tr><td><span class="sw" style="background:#cc0000"></span>Substantial</td><td class="mono">0.01 ≤ RIF &lt; 0.1</td></tr>
        <tr><td><span class="sw" style="background:#94100c"></span>Major</td><td class="mono">0.1 ≤ RIF &lt; 1</td></tr>
        <tr><td><span class="sw" style="background:#5b0f00"></span>Severe</td><td class="mono">RIF ≥ 1</td></tr>
      </tbody></table></div>
      <p class="cap">Based on Kumar (2025), Table 2.</p>` },
  { id: 'suppliers', g: 'The method', t: 'Step 3: Substitutability', s: 'Step 3: Substitutability', h: () => `
      <p>The substitutability test asks whether existing alternatives can replace the supply if needed. The Observatory answers it with data on who exports each product, taken from BACI, the international trade database that CEPII, the French research centre for international economics, builds from customs reports to the United Nations. The Observatory of Economic Complexity draws on the same database. The figures are for ${SUP ? SUP.meta.year : 2024}.</p>
      <h2>China's share of global exports</h2>
      <p>For each HS6 product, this is the share of global exports, by value, that comes from China. Items where China supplies under 30% are set aside, unless export cover (below) keeps them. China is not a dominant supplier of those products, so other countries already supply most of what the world sells, and India's reliance on China is largely a sourcing choice.</p>
      <p>The 30% line follows the dependence filter. China makes about 30% of the world's manufactured goods. A product where China supplies less than that is not concentrated in China at the world level. Where China supplies 30% or more, it is a major or dominant source worldwide, so alternatives are thinner.</p>
      <h2>Export cover</h2>
      <p>China's share alone can mislead when India buys a lot. China may supply a small share of global exports, yet what India buys from China may be large against what everyone else exports, so other suppliers could not cover it quickly. This is the scalability question in the substitutability test. Export cover answers it.</p>
      <p>The full name is <strong>India's imports as a share of global export capacity outside China</strong>. The Explorer's table shortens it to "export cover", because the full name does not fit.</p>
      <p><span class="formula">Export cover (%) = <span class="frac"><span class="fr"><span>India's imports of the product from China</span><span>Exports of the product by every country except China</span></span><span class="x">× 100</span></span></span></p>
      <p><strong>The logic.</strong> Suppose China stopped supplying India. Other countries would have to sell India what it now buys from China. Comparing that amount with what other countries already export shows how big a job it would be. If India's purchases are a small slice of what the rest of the world exports, a small increase in exports would cover them. If they are a large slice, the rest of the world could not cover them.</p>
      <p><strong>What the number says.</strong> A small number means more cover: other countries export far more than India buys from China. A large number means less cover. At 100%, India buys from China exactly as much as everyone else exports. Above 100%, it buys more.</p>
      <div class="scroll-x keytable"><table class="data"><thead><tr><th>Example, 2024</th><th class="n">India buys from China</th><th class="n">All other countries export</th><th class="n">Export cover</th><th>Reading</th></tr></thead><tbody>
        <tr><td>Portable computers</td><td class="n">US$5.4 bn</td><td class="n">US$58.9 bn</td><td class="n">9.2%</td><td>India's purchases are under a tenth of what others export. Cover is wide.</td></tr>
        <tr><td>Lithium-ion batteries</td><td class="n">US$2.5 bn</td><td class="n">US$49.2 bn</td><td class="n">5.1%</td><td>About a twentieth of what others export, just above the 5% line.</td></tr>
        <tr><td>Embroidery machines</td><td class="n">US$331 mn</td><td class="n">US$419 mn</td><td class="n">79%</td><td>Nearly four-fifths of what others export. Cover is thin: they would have to hand over almost everything they export.</td></tr>
      </tbody></table></div>
      <p>In the Explorer, the Export cover column shows this percentage. Hovering over a figure, or over the heading, opens a short explanation. The popup for a figure also shows that item's own numbers.</p>
      <p>The 5% line is the one the substitutability gate uses. If China supplies under 30% of global exports, an item is set aside only when export cover is 5% or less. Above 5%, it goes forward.</p>
      <h2>Why the line is 5%</h2>
      <p>The line has to be set by how much more other exporters could realistically sell in a year. If China stopped supplying India, the only quick way to cover India's purchases is for other countries to export more. Export cover is the size of that increase. At 5%, other countries would have to raise their exports of the product by 5% above what they sell today. At 10%, by 10%. So the question is what a year of expansion normally looks like.</p>
      <p>Three checks give the answer.</p>
      <ul>
        <li><strong>Products.</strong> The Observatory compared exports of every country except China, product by product, across the 4,440 HS6 products in its data, using BACI for 2022, 2023 and 2024. In those two annual changes, six in ten products saw exports stay flat or fall. About 27% grew by more than 5% in a year, about 17% by more than 10%, and about 9% by more than 20% (by quantity, products with over US$10 million of exports). A 5% rise is therefore what a good year looks like for a product, 10% is a strong year, and 20% is exceptional.</li>
        <li><strong>World trade.</strong> The WTO puts growth in the volume of world merchandise trade at 2.9% in 2024.</li>
        <li><strong>Factory capacity.</strong> The United States Federal Reserve estimates that US manufacturing capacity grew about 0.5% a year from 2022 to 2025, against a long-run average of about 2%.</li>
      </ul>
      <p>The last two are aggregates and the first is the product level, but all three say the same thing: expansion of 5% in a year is ordinary at best, and expansion of 10% is unusual.</p>
      <h2>Why 5% and not 10%</h2>
      <p>The line decides which items are set aside, and setting an item aside is a claim that alternatives exist. That claim should hold in an ordinary good year, not only in an unusually strong one. At 5% it does: an item is set aside only if a normal year of expansion would cover India's purchases. At 10% the claim would rest on a year that only about one product in six manages.</p>
      <p>Four further points favour the stricter line.</p>
      <ul>
        <li><strong>The growth is not all for India.</strong> New exports go to every buyer, and other buyers' demand grows too. Only part of any increase would be available to India.</li>
        <li><strong>A halt would be sudden.</strong> New factories and mines take years to build. In the first year, other exporters would mostly have to stretch existing capacity.</li>
        <li><strong>The costs are not equal.</strong> Setting an item aside wrongly removes a real vulnerability from view. Letting an item go forward unnecessarily costs a human examination in the last step, which is built to deal with it.</li>
        <li><strong>The next step can correct the line.</strong> Items that go forward are still tested for complexity, and every vulnerable item is examined case by case.</li>
      </ul>
      <p>The table shows what the choice does, for FY 2025-26 (the figures move a little with the data).</p>
      <div class="scroll-x keytable"><table class="data"><thead><tr><th>Line</th><th>An item is set aside if</th><th class="n">Products that grew this much in a year</th><th class="n">Items going forward</th><th class="n">Strategic and critical</th></tr></thead><tbody>
        <tr><td><strong>5% (used)</strong></td><td>a good year of expansion would cover it</td><td class="n">27%</td><td class="n">1,211</td><td class="n">234</td></tr>
        <tr><td>10%</td><td>a strong year would cover it</td><td class="n">17%</td><td class="n">1,120</td><td class="n">201</td></tr>
        <tr><td>20%</td><td>an exceptional year would cover it</td><td class="n">9%</td><td class="n">1,099</td><td class="n">194</td></tr>
      </tbody></table></div>
      <p>Moving from 5% to 10% sets aside 91 more items, and 33 fewer end up strategic or critical. The distribution of export cover has no natural break, so the line is a judgment. It is a reasoned first value, not a measured constant, and the Explorer lets you test others.</p>
      <p><strong>What the evidence cannot show.</strong> It rests on two annual changes, both in a weak period for world trade, and product-level figures are noisy. Growth in exports is also not spare capacity: it shows what exporters did sell, not what they could have sold. It is a guide to what expansion is realistic, not a forecast of what a country would supply to India.</p>
      <p>This is demonstrated export capacity: what other countries actually export. It is not spare capacity. A low number shows that other countries sell a lot of the product. It does not show that they have room to sell more to India.</p>
      <h2>Other exporters</h2>
      <p>The number of countries other than China that each hold 10% or more of global exports. It shows how deep the alternatives run. It does not set items aside. The item panel states it, and the Explorer's threshold panel lets you filter on it.</p>
      <h2>What the measures cover</h2>
      <p>The framework describes three ways the substitutability test can be failed. There may be no alternative at all. Alternatives may exist but be too small to meet the demand quickly. Or switching may cost too much. China's share and the number of other exporters speak to the first. Export cover speaks to the second. The third cannot be measured from trade data and goes to the human examination.</p>
      <h2>What to keep in mind</h2>
      <ul>
        <li><strong>HS6 only.</strong> BACI is published at HS6, so every HS8 line under an HS6 product shows the same suppliers.</li>
        <li><strong>One calendar year.</strong> BACI covers calendar years and runs about a year behind. The figures refer to ${SUP ? SUP.meta.year : 2024} whichever financial year is selected, so the substitutability gate does not change from year to year.</li>
        <li><strong>A different source.</strong> BACI reconciles exporters' and importers' customs reports and adjusts for freight and insurance, so its figures differ from the Commerce Ministry's HS8 data. They are usually close. Where China's share of India's imports differs by more than 20 percentage points, the item page says so.</li>
        <li><strong>Exports are not production.</strong> China's export share understates its position where China uses much of what it makes, or controls an input that others need.</li>
        <li><strong>Supply is not willingness.</strong> A country that exports a product may lack spare capacity, may be bound by sanctions or its own export controls, or may not sell to India.</li>
        <li><strong>Trading hubs.</strong> Hong Kong, Singapore and similar hubs can appear as suppliers of goods made elsewhere, including in China.</li>
        <li><strong>Taiwan.</strong> BACI records Taiwan as “Other Asia, nes”. It is shown here as Taiwan.</li>
        <li><strong>No supplier data.</strong> A few items have no record in BACI. They are not set aside. They are shown as not assessed so that they can be reviewed.</li>
      </ul>` },
  { id: 'pci', g: 'The method', t: 'Step 4: Capability and duration (PCI)', s: 'Step 4: Capability (PCI)', h: () => `
      <p>PCI was developed by Hidalgo and Hausmann (2009). It ranks products by how much know-how is needed to make them. A product scores high when only a few advanced economies can make it.</p>
      <p>Scores range roughly from -3 to +3. Raw materials and farm goods score lowest. Machinery, electronics and chemicals score highest.</p>
      <p>Scores come from the Observatory of Economic Complexity, at HS6 level (HS 2022 series, 2024). Each HS8 line takes the score of its HS6 code. A line whose HS6 code has no score is marked <strong>Not assessed</strong> until a score is found.</p>
      <div class="callout"><strong>Why HS8 items take an HS6 score.</strong> PCI is calculated only down to HS6, the most detailed level at which it is published. One option was to run the whole study at HS6, but that would still give every product in an HS6 category the same score. Instead, each HS8 item takes the PCI of its HS6 category, while the dependence filter and the RIF threshold are applied to each HS8 item on its own. This has three advantages. Each item is judged on its own imports and its own dependence on China. Items whose own RIF falls below 0.01 are set aside, even when their HS6 category as a whole would pass. And HS8 describes each item more precisely than HS6, so it is clear exactly what the item is.</div>
      <p>PCI stands in for the capability gap test. It also indicates how long a disruption could last, which the At a Glance page calls <strong>duration of disruption</strong>. A product with a high PCI is hard to replace. Building new capacity takes heavy investment and know-how, and few other suppliers exist. A product with a low PCI is easier to replace. New capacity is cheaper, and the know-how is widespread, so alternatives can appear quickly.</p>
      <div class="scroll-x keytable"><table class="data"><thead><tr><th>Complexity</th><th>Range</th><th>Disruption (indicative)</th></tr></thead><tbody>
        <tr><td>${swatch('low')}Mild</td><td class="mono">1 ≤ PCI &lt; 1.25</td><td>Short-term: up to 9 months</td></tr>
        <tr><td>${swatch('mod')}Moderate</td><td class="mono">1.25 ≤ PCI &lt; 1.5</td><td>Short to medium-term: 9 to 18 months</td></tr>
        <tr><td>${swatch('high')}High</td><td class="mono">1.5 ≤ PCI &lt; 1.75</td><td>Medium-term: about 18 months</td></tr>
        <tr><td>${swatch('vh')}Very High</td><td class="mono">1.75 ≤ PCI &lt; 2</td><td>Medium to long-term: 18 to 27 months</td></tr>
        <tr><td>${swatch('crit')}Extremely High</td><td class="mono">PCI ≥ 2</td><td>Long-term: over 27 months</td></tr>
      </tbody></table></div>
      <p class="cap">Based on Kumar (2025), Table 3, and Kumar (2026), Table 3.2.</p>
      <p>Below a PCI of 1, many countries have the know-how to make the product. These items are set aside as low-complexity dependence. From 1 upward, the scale is cut into equal steps of 0.25, from Mild to Extremely High. Each step up means fewer producers and a longer disruption. A PCI of 1.75 or more passes the capability gap test, so the item is critical.</p>
      <div class="callout"><strong>These durations are indicative.</strong> PCI shows how widely the know-how to make a product is spread. That makes it a good guide to how hard the product is to replace. It does not show how long India would actually take to find new suppliers or build capacity. That also depends on stocks, contracts, investment, regulation and policy. Read the durations as a ranking of how hard products are to replace, not as forecasts.</div>` },
  { id: 'matrix', g: 'The method', t: 'Putting it together: sorting and verdicts', s: 'Sorting and verdicts', h: () => {
    const t4cols = MATRIX_COLS.filter(c => c.id !== 'na');
    const t4 = RIF_ROWS.map(rw => `<tr><th class="rh" style="background:${rw.fill}">${rw.name}<span class="mr">${rw.range}</span></th>${
      t4cols.map(c => `<td class="m-${c.id}"><span class="cn-l">${cellName(rw.id, c.id)}</span><span class="cn-s">${c.dur}</span></td>`).join('')}</tr>`).join('');
    return `
      <p>The gates are applied together, so the order does not change which items pass. Two views show how the items are graded, one for each part of the framework.</p>
      <h2>The substitutability sorting: strategic</h2>
      <p>The substitutability page sorts each item that clears the dependence filter and the RIF threshold into six boxes, by China's share of global exports and, for items under 30%, by export cover. It tests the strategic part of the framework. Scale of disruption is not used, because RIF has already been applied and plays no part in this test.</p>
      <div class="scroll-x keytable"><table class="data"><thead><tr><th>Box</th><th>China's share of global exports</th><th>What happens</th></tr></thead><tbody>
        <tr><td><span class="sw" style="background:var(--c-alt)"></span>Set aside</td><td class="mono">Under 30%, and export cover of 5% or less</td><td>Alternatives exist. The item is set aside.</td></tr>
        <tr><td><span class="sw" style="background:#d9c7a0"></span>Goes forward: limited export cover</td><td class="mono">Under 30%, and export cover above 5%</td><td>Other countries' exports barely cover India's purchases. The item goes forward.</td></tr>
        <tr><td><span class="sw" style="background:#e8c6d6"></span>30 to 50%</td><td class="mono">30% ≤ share &lt; 50%</td><td>China is a major supplier to the world. The item goes forward.</td></tr>
        <tr><td><span class="sw" style="background:#b86a93"></span>50 to 75%</td><td class="mono">50% ≤ share &lt; 75%</td><td>China dominates world supply. The item goes forward.</td></tr>
        <tr><td><span class="sw" style="background:#620d3c"></span>75% or more</td><td class="mono">share ≥ 75%</td><td>China is almost the only supplier. The item goes forward.</td></tr>
        <tr><td><span class="sw" style="background:#fff;border:1px dashed rgba(23,20,19,0.5)"></span>No supplier data</td><td class="mono">Not assessed</td><td>The item is not set aside, so that it can be reviewed.</td></tr>
      </tbody></table></div>
      <h2>The verdict matrix: critical</h2>
      <p>The verdict matrix places each item that goes forward by its scale of disruption (rows) and its complexity (columns). It tests the critical part of the framework through the capability gap.</p>
      <ul>
        <li>Items with a PCI of 1.75 or more pass the capability gap test and are critical.</li>
        <li>Items in national-security sectors are critical outright, whatever their PCI. They have their own column.</li>
        <li>Items with a PCI of at least 1 but below 1.75 are strategic vulnerabilities.</li>
        <li>Items with a PCI below 1 are shown as low-complexity dependence. The shock is real, but many countries have the know-how to make the product.</li>
        <li>Items with no PCI score are not assessed until a score is found.</li>
      </ul>
      <div class="mx-fit keytable">
        <table class="matrix static">
          <thead><tr><th class="corner" aria-label="Rows: scale of disruption (RIF). Columns: duration of disruption (PCI)."><span class="cx cx-d">Duration<small>PCI →</small></span><span class="cx cx-s">Scale<small>RIF ↓</small></span></th>${t4cols.map(c => `<th class="m-${c.id}"><span class="mn">${c.name}</span><span class="mr">${c.range}</span></th>`).join('')}</tr></thead>
          <tbody>${t4}</tbody>
          <tfoot><tr><td></td><td class="span one">Low-complexity dependence</td><td class="span" colspan="3">Strategic vulnerability →</td><td class="span" colspan="3">Critical vulnerability →</td></tr></tfoot>
        </table>
      </div>
      <p class="cap">Based on Kumar (2025), Table 4, with a column added for national-security sectors. Disruption horizons in the cells are indicative and derived from PCI.</p>`; } },
  { id: 'verdicts', g: 'The method', t: 'Strategic and critical vulnerability', s: 'Strategic and critical', h: () => `
      <p>Each verdict has two definitions. The SCV framework gives a qualitative definition. The measures give a quantitative one. This dashboard computes the quantitative definition for every item. The shortlisted items are then examined against the qualitative definition.</p>
      <div class="scroll-x keytable"><table class="data defs"><thead><tr><th></th><th>Qualitative: SCV framework</th><th>Quantitative: the Observatory's measures</th></tr></thead><tbody>
        <tr><td><strong>Strategic vulnerability</strong></td>
          <td>A vulnerability that an adversary could exploit for strategic ends, through economic coercion, with likely geopolitical or geoeconomic costs for India. A dependence is a strategic vulnerability if it passes the adversary and substitutability tests, and either the incidence or the cascading test.</td>
          <td>Dependence on China of 30% or more, an RIF of 0.01 or more, limited alternatives (China supplies 30% or more of global exports, or India's purchases are large against everyone else's exports), and a PCI of at least 1 but below 1.75.</td></tr>
        <tr><td><strong>Critical vulnerability</strong></td>
          <td>A strategic vulnerability that also passes the capability gap test or the national security test. The adversary's technical lead cannot be matched within 18 months, or the dependence lies in a sensitive sector.</td>
          <td>The same gates, and either a PCI of 1.75 or more, or an item in a national-security sector, which is critical outright.</td></tr>
      </tbody></table></div>
      <p>The split at a PCI of 1.75 follows the disruption timelines. From a PCI of 1.75 upward, a disruption could last beyond 18 months. That is the time frame the capability gap test uses to define a critical vulnerability.</p>
      <p>Items in national-security sectors are critical once they pass the earlier gates, whatever their PCI. The sector list applies to whole HS4 headings, so the human examination checks each flagged item.</p>` },
  { id: 'human', g: 'The method', t: 'Step 5: Human examination', s: 'Step 5: Human examination', h: () => `
      <p>The numbers shortlist items. They cannot decide them. Every item that goes forward needs a human examination, and some items that were set aside deserve a second look.</p>
      <h2>What the examination covers</h2>
      <ul>
        <li><strong>Incidence.</strong> How many people would be affected, and how much the product matters to them. RIF shows only the size of the shock.</li>
        <li><strong>Cascading.</strong> Whether a disruption would spread to other industries along the supply chain, judged by value added and jobs.</li>
        <li><strong>Switching cost.</strong> Whether alternatives could supply India at a reasonable cost and in time.</li>
        <li><strong>National security.</strong> Whether the item really serves a sensitive sector. The list works by whole HS4 headings, so it also flags some consumer goods.</li>
        <li><strong>Capability gap.</strong> Whether China truly holds the lead, or the know-how is simply rare.</li>
      </ul>
      <h2>Items set aside that deserve a second look</h2>
      <ul>
        <li><strong>Alternatives exist.</strong> China's export share can understate its position where China uses much of what it makes, or controls an input that others need.</li>
        <li><strong>Low-complexity dependence where China dominates.</strong> A low PCI means the know-how is widespread. It does not mean others supply the product at scale.</li>
        <li><strong>The watch list.</strong> Acute dependence on complex products too small to pass the RIF threshold.</li>
        <li><strong>Basket lines.</strong> Residual lines whose PCI averages very different products.</li>
      </ul>
      <p>The Explorer shows every set-aside group, with all the measures beside each item, and lets you set your own thresholds to test other lines.</p>` },
  { id: 'data', g: 'Reference', t: 'Data', s: 'Data', h: () => `
      <p>The trade data covers India's total imports and its imports from China for four financial years, FY 2022-23 to FY 2025-26. It comes from the Ministry of Commerce and Industry.</p>
      <p>Goods are classified under the Harmonised System (HS), which has four levels. HS2 is the broadest. HS4 is in between. HS6 and HS8 describe individual goods in the most detail.</p>
      <p>The Observatory works at HS8, the most detailed level India reports. It tests all ${int(ITEMS.length)} lines. This means a single, highly dependent line cannot hide inside a broader group.</p>
      <p>A few HS8 codes were revised between these years. A line that exists only in the earlier or the later years shows no imports in the years where its code does not exist.</p>` },
  { id: 'security', g: 'Reference', t: 'National-security sectors', s: 'National-security sectors', h: () => `
      <p>Because the national security test has no number behind it, the Observatory marks items in the HS4 headings listed below and treats them as critical outright. These headings serve sectors the SCV framework names, such as power grids, communications, digital infrastructure and C4ISR. They also cover the signalling systems that run transport networks.</p>
      <p>A flagged item that clears the dependence, scale and substitutability gates is critical outright, whatever its PCI. That includes items that would otherwise be low-complexity dependence. The list is indicative. It applies to whole headings, so it also flags some consumer goods within them. The human examination checks each one.</p>
      <div class="scroll-x keytable"><table class="data"><thead><tr><th>HS4</th><th>Heading</th></tr></thead><tbody>
        ${Object.entries(NS_HEADINGS).map(([h, d]) => `<tr><td class="mono">${h}</td><td>${esc(d)}</td></tr>`).join('')}
      </tbody></table></div>` },
  { id: 'watch', g: 'Reference', t: 'Watch list: small but acute', s: 'Watch list', h: () => `
      <p>The RIF threshold sets aside items whose imports are too small to cause a meaningful shock. That carries a risk. Some products have critical uses but are needed only in small quantities, so their RIF stays below 0.01 even when India depends on China for almost all of them.</p>
      <p>The watch list catches these items. An item is on it when all four of these hold:</p>
      <ul><li>Dependence on China is 70% or more (Acute).</li><li>The PCI is 1 or more, so the product is complex and few countries make it.</li><li>The RIF is below 0.01, so the item falls outside the matrix.</li><li>Alternatives are limited: China supplies 30% or more of global exports, or India's purchases are large against everyone else's exports.</li></ul>
      <p>For these items, the RIF matters little. What matters is how dependent India is and how hard the product is to replace.</p>
      <p>Items that miss on all three counts are not flagged. With dependence below 70%, India already buys part of its supply elsewhere. With an RIF below 0.01, a cut-off would be a small shock. And with a PCI below 1, many countries make the product.</p>
      <p>The watch list is a prompt for a case-by-case assessment, not a verdict. Each item needs a look at what it is used for.</p>` },
  { id: 'lowc', g: 'Reference', t: 'Low complexity and basket lines', s: 'Low complexity and baskets', h: () => `
      <h2>Low-complexity dependence</h2>
      <p>These lines clear the dependence, scale and substitutability gates but have a PCI below 1. The shock is real, but the products are simple to make by world standards. Many countries export them, so India can more easily find other suppliers.</p>
      <p>Low PCI describes the finished product, not its inputs. Smartphones, laptops, solar cells and bulk drugs score low because many countries assemble or export them. Their key inputs, such as chips, wafers and pharmaceutical starting materials, are complex and concentrated. Read this category as "easier to diversify", not as "easy to make at home".</p>
      <h2>Basket lines</h2>
      <p>PCI is published only at HS6, so every HS8 line takes the score of its HS6 code. For residual "other" lines, that score is an average across very different products. Their RIF may also reflect how broad the basket is, rather than a single chokepoint.</p>
      <p>Several basket lines have some of the largest RIF values in the data. They are flagged as basket lines, and their verdicts should be read with care.</p>` },
  { id: 'colours', g: 'Reference', t: 'Verdicts and colours', s: 'Verdicts and colours', h: () => `
      <p>The colours match the vulnerability matrix. Teal marks low-complexity dependence.</p>
      <div class="scroll-x keytable"><table class="data"><thead><tr><th>Verdict</th><th>PCI</th><th>Disruption (indicative)</th></tr></thead><tbody>
        <tr><td>${swatch('crit')}Critical: Extremely High complexity</td><td class="mono">PCI ≥ 2</td><td>Long-term: over 27 months</td></tr>
        <tr><td>${swatch('nsc')}Critical: National-security sector</td><td class="mono">Any PCI</td><td>Critical outright</td></tr>
        <tr><td>${swatch('vh')}Critical: Very High complexity</td><td class="mono">1.75 to &lt; 2</td><td>Medium to long-term: 18 to 27 months</td></tr>
        <tr><td>${swatch('high')}Strategic: High complexity</td><td class="mono">1.5 to &lt; 1.75</td><td>Medium-term: about 18 months</td></tr>
        <tr><td>${swatch('mod')}Strategic: Moderate complexity</td><td class="mono">1.25 to &lt; 1.5</td><td>Short to medium-term: 9 to 18 months</td></tr>
        <tr><td>${swatch('low')}Strategic: Mild complexity</td><td class="mono">1 to &lt; 1.25</td><td>Short-term: up to 9 months</td></tr>

const PAGE_NAME = { overview: 'At a Glance', explorer: 'Vulnerability Explorer', methodology: 'Methodology', about: 'About', author: 'About the author' };
function runSearch(raw) {
  const q = raw.trim().toLowerCase(), box = $('#sRes');
  sHits = []; sOn = -1;
  if (q.length < 2) { box.innerHTML = ''; return; }
  const idx = searchIndex(), digits = /^\d+$/.test(q);
  // Commodities: HS code prefix, or words in the name or HS6 description; names that start with the query first
  const items = ITEMS.map(i => {
    const name = i.name.toLowerCase(), d6 = (DATA.hs6[i.hs6] || '').toLowerCase();
    const s = digits ? (i.hs8.startsWith(q) ? 3 : 0) : name.startsWith(q) ? 3 : name.includes(q) ? 2 : d6.includes(q) ? 1 : 0;
    return { i, s };
  }).filter(x => x.s).sort((a, b) => b.s - a.s || R(b.i).rif - R(a.i).rif);
  const terms = digits ? [] : GLOSSARY.map(([t, , d]) => ({ t, d, s: t.toLowerCase().includes(q) ? 2 : d.toLowerCase().includes(q) ? 1 : 0 }))
    .filter(x => x.s).sort((a, b) => b.s - a.s);
  const secs = digits ? [] : idx.sections.map(x => ({ ...x, s: x.t.toLowerCase().includes(q) ? 2 : x.k.includes(q) ? 1 : 0 }))
    .filter(x => x.s).sort((a, b) => b.s - a.s);
  const wordRe = new RegExp('\\b' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  const termFirst = terms.some(x => wordRe.test(x.t));
  let html = '', hItems = '', hTerms = '', hSecs = '';
  if (items.length) {
    hItems += `<h3>Commodities <span>${int(items.length)} ${items.length === 1 ? 'match' : 'matches'}</span></h3>`;
    items.slice(0, 8).forEach(({ i }) => { sHits.push({ kind: 'item', hs8: i.hs8 });
      hItems += `<button type="button" class="s-item" role="option" data-n="${sHits.length - 1}"><span class="s-code">${i.hs8}</span><span>${esc(i.name)}</span>${badge(R(i).cat)}${DATA.hs6[i.hs6] ? `<span class="s-sub">${esc(DATA.hs6[i.hs6])}</span>` : ''}</button>`; });
    if (items.length > 8) hItems += `<a class="s-all" href="#explorer?q=${encodeURIComponent(raw.trim())}&tab=all">See all ${int(items.length)} in the Vulnerability Explorer →</a>`;
  }
  if (terms.length) {
    hTerms += `<h3>Glossary <span>${terms.length}</span></h3>`;
    terms.slice(0, 5).forEach(x => { sHits.push({ kind: 'term', g: slug(x.t) });
      hTerms += `<button type="button" class="s-item" role="option" data-n="${sHits.length - 1}"><span class="s-kind">Term</span><span>${esc(x.t)}</span><span></span><span class="s-sub">${esc(x.d.length > 140 ? x.d.slice(0, 138).trim() + '…' : x.d)}</span></button>`; });
  }
  if (secs.length) {
    hSecs += `<h3>Sections <span>${secs.length}</span></h3>`;
    secs.slice(0, 6).forEach(x => { sHits.push({ kind: 'sec', hash: x.hash });
      hSecs += `<button type="button" class="s-item" role="option" data-n="${sHits.length - 1}"><span class="s-kind">${PAGE_NAME[x.page]}</span><span>${esc(x.t)}</span><span></span></button>`; });
  }
  html = termFirst ? hTerms + hSecs + hItems : hItems + hTerms + hSecs;
  box.innerHTML = html || `<p class="s-none">Nothing matches “${esc(raw.trim())}”. Try an HS code, a product name or a term such as “dependence”.</p>`;
}
function openSearch() {

function pickHit(n) {

function markOn(n) {
  const els = $$('#sRes .s-item'); if (!els.length) return;
  sOn = (n + els.length) % els.length;
  els.forEach((e, k) => e.classList.toggle('on', k === sOn)); els[sOn].scrollIntoView({ block: 'nearest' });
}
function initSearch() {
  $('#searchBtn').addEventListener('click', openSearch);
  $('#sClose').addEventListener('click', closeSearch);
  $('#search').addEventListener('click', e => { if (e.target.id === 'search') closeSearch(); });
  let t; $('#sq').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => runSearch(e.target.value), 120); });
  $('#sq').addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); markOn(sOn + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); markOn(sOn - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); const el = $$('#sRes .s-item')[sOn >= 0 ? sOn : 0]; if (el) pickHit(+el.dataset.n); }
  });
  $('#sRes').addEventListener('click', e => { const b = e.target.closest('.s-item'); if (b) pickHit(+b.dataset.n); else if (e.target.closest('.s-all')) closeSearch(); });
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((e.key === '/' && !typing) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) { e.preventDefault(); openSearch(); }
    else if (e.key === 'Escape') closeSearch();
  });
}

    </div>
    ${i.ns ? `<p class="dr-flag ns">This item is in a <b>national-security sector</b>: ${esc(NS_HEADINGS[i.hs8.slice(0, 4)])}. ${CRIT.includes(R(i).cat) ? 'It clears the dependence, scale and substitutability gates, so it is critical outright.' : 'If it cleared the dependence, scale and substitutability gates, it would be critical outright.'}</p>` : ''}
    ${R(i).cat === 'alt' ? `<p class="dr-flag bk"><b>Alternatives exist.</b> China supplies ${pct(i.sw)} of global exports of this product${i.cv != null ? `, and India's imports from China are ${coverOf(i.cv).x} of export capacity outside China` : ''}. The item is set aside at the substitutability test and can be reviewed in the Explorer.</p>` : ''}
    ${R(i).watch ? '<p class="dr-flag wl"><b>Watch list.</b> India depends on China for 70% or more of this item, and the product is complex (PCI of 1 or more). Its imports are too small to pass the RIF threshold, so it is not in the matrix. It may still have critical uses and needs a case-by-case look.</p>' : ''}
    ${i.basket ? '<p class="dr-flag bk"><b>Basket line.</b> This is a residual "other" line. Its PCI is an average for a mixed group of products, so read its verdict with care.</p>' : ''}
    <h3>By year</h3>
    <div class="scroll-x"><table class="data years"><thead><tr><th></th>${YEARS.map(y => `<th class="n">${FY[y].slice(3)}</th>`).join('')}</tr></thead><tbody>
      ${rows.map(([k, f]) => `<tr><td>${k}</td>${YEARS.map(y => `<td class="n">${f(i.y[y])}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>
    ${suppHTML(i)}
    ${sib.length ? `<h3>Other lines under HS6 ${i.hs6}</h3>${sib.map(x => `<button type="button" class="sib" data-hs8="${x.hs8}"><span class="mono">${x.hs8}</span>${esc(x.name)} ${badge(R(x).cat)}</button>`).join('')}` : ''}
    <p class="cap" style="margin-top:22px"><a href="#explorer?q=${i.hs6}">Open HS6 ${i.hs6} in the Vulnerability Explorer</a> · <a href="#methodology?s=contact&hs8=${i.hs8}">Suggest a correction to this item</a></p>`;
  dr.classList.add('open');
  dr.setAttribute('aria-hidden', 'false');
  document.body.classList.add('locked');
  $('#drClose').addEventListener('click', closeDetail);
  $$('.sib', dr).forEach(b => b.addEventListener('click', () => openDetail(b.dataset.hs8)));
  dr.scrollTop = 0;
  $('#drClose').focus();
}

function closeDetail() {
  const dr = $('#drawer');
  if (!dr || !dr.classList.contains('open')) return;
  dr.classList.remove('open');
  dr.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('locked');
}

// Logo: "INDIA TRADE" is letter-spaced so it spans exactly the width of "bservatory" (refits on font load and resize)
function fitLogo() {
  const a = document.querySelector('.home-link .w0'), b = document.querySelector('.home-link .w1');
  if (!a || !b) return;
  a.style.letterSpacing = '0'; a.style.width = 'auto';
  const W = b.getBoundingClientRect().width, nat = a.getBoundingClientRect().width, n = a.textContent.length;
  if (W && nat) { a.style.letterSpacing = ((W - 2 - nat) / (n - 1)) + 'px'; a.style.width = (W - 1) + 'px'; }
}
fitLogo();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLogo);
{ let ft; addEventListener('resize', () => { clearTimeout(ft); ft = setTimeout(fitLogo, 120); }); }
</script>
</body>
