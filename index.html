      </tbody></table></div>` },
  { id: 'watch', g: 'Reference', t: 'Grades: vulnerability, dependence and others', s: 'Vulnerability and dependence', h: () => `
      <p>The Observatory follows the grades of the SCV Framework: <strong>dependence</strong>, <strong>vulnerability</strong>, <strong>Strategic Vulnerability</strong> and <strong>Critical Vulnerability</strong>. Each item India imports from China is placed in one grade, so the grades do not overlap and their counts do not add up into one another. Two further lists, Others and All items, complete the Explorer.</p>
      <p>In the framework, dependence becomes a vulnerability when disruptive factors such as trade barriers or supply shocks make it unreliable. The Observatory does not measure those factors item by item. It treats China as an adversary for every item, so its reading is this: a dependence is a <strong>vulnerability</strong> when a disruption would cause a large shock, or a shock that would take long to recover from. It is a <strong>Strategic Vulnerability</strong> only when the shock would be both meaningful in scale and long in duration.</p>
      <p>Each dependent item is sorted by two questions. <strong>Part 1: are alternatives not enough?</strong> Yes if China supplies 30% or more of world exports, or India's imports from China are more than 5% of non-China exports. <strong>Part 2: is the PCI 1 or more?</strong> The two questions are the two parts of the Substitutability Test. Items where China makes 50% or more of world output fail both. An item that fails both would take long to restore.</p>
      <h2>Meaningful scale (RIF 0.01 or more)</h2>
      ${gridHTML(S.year, 'L')}
      <p>Items that fail both parts are potential Strategic or Critical Vulnerabilities. In the other three boxes the disruption would be shorter; items there are graded Vulnerabilities if their scale is Severe or Major, because the shock would be large, and Dependence if it is Substantial.</p>
      <h2>Small scale (RIF below 0.01)</h2>
      ${gridHTML(S.year, 'S')}
      <p>Items that fail both parts would take long to restore, but the Scale of Disruption is low, so they are graded Vulnerabilities, not strategic. Some products have critical uses in small quantities. The rest are graded Dependence.</p>
      <h2>Dependence and Others</h2>
      <p>Dependence holds items India buys 30% or more from China that the tests give no reason to grade higher. In the framework, dependence on its own is not a vulnerability. Others holds items with dependence below 30%, and the few items that cannot be assessed because no PCI score could be found or estimated.</p>
      <p>Vulnerabilities are not counted with Strategic or Critical Vulnerabilities, but each deserves a case-by-case look.</p>` },
  { id: 'lowc', g: 'Reference', t: 'Low complexity and basket lines', s: 'Low complexity and baskets', h: () => `
      <h2>Low-complexity dependence</h2>
      <p>These lines clear the dependence and scale gates, and they go forward on the first part of the Substitutability Test, but have a PCI below 1, and China makes under 50% of world output. The second part of the Substitutability Test sets them aside. The shock is real, but the products are simple to make by world standards, so new suppliers can emerge more easily.</p>
      <p>Low PCI describes the finished product, not its inputs. Many assembled goods and bulk drugs score low because many countries assemble or export them, while their key inputs, such as chips, wafers and pharmaceutical starting materials, are complex and concentrated. Where China makes 50% or more of world output, the item fails the Substitutability Test even with a low PCI: solar cells and rare-earth magnets are examples. Some low-PCI items have only a few competitive exporters, or sit in national-security sectors, such as laptops, display modules and telecom equipment parts. The method sets them aside with the rest, so the Human Examination should look at them. Read this category as "easier to diversify", not as "simple for India to make".</p>
      <h2>Basket lines</h2>
      <p>PCI is published only at HS6, so every HS8 line takes the score of its HS6 code. For residual "other" lines, that score is an average across very different products. Their RIF may also reflect how broad the basket is, rather than a single chokepoint.</p>
      <p>Several basket lines have some of the largest RIF values in the data. They are flagged as basket lines, and their verdicts should be read with care.</p>` },

    <p>This chart shows the whole method at once. Every HS8 item India imports from China passes through the same gates, in the order of the <a href="#methodology?s=scv">SCV Framework</a>, and each gate has a measured cut-off. An item that fails a gate leaves the flow there and takes the grade shown beside it. An item that passes goes on to the next gate. Select a number to see those items in the Explorer.</p>
    <p>The framework asks these questions as matters of judgement. Here each is answered with a measure and a threshold, and a <a href="#methodology?s=human">Human Examination</a> then looks at what the numbers cannot show. The Substitutability Test follows one rule:</p>
    <p class="formula">[ (China's share of world exports ≥ 30% <b>OR</b> India's imports from China &gt; 5% of non-China exports) <b>AND</b> PCI ≥ 1 ] <b>OR</b> China's share of world production ≥ 50%</p>
    <p>The chart checks production share first, because it settles the test on its own. As in the framework, a Critical Vulnerability is a Strategic Vulnerability that also passes the Capability Gap Test or the National Security Test, so both come after substitutability.</p>

  $('#searchBtn').addEventListener('click', openSearch);
  $('#sClose').addEventListener('click', closeSearch);
  $('#search').addEventListener('click', e => { if (e.target.id === 'search') closeSearch(); });
  let t; $('#sq').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => runSearch(e.target.value), 120); });
  $('#sq').addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); markOn(sOn + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); markOn(sOn - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); const el = $$('#sRes .s-item')[sOn >= 0 ? sOn : 0]; if (el) pickHit(+el.dataset.n); }
  });
  $('#sRes').addEventListener('click', e => { const b = e.target.closest('.s-item'); if (b) pickHit(+b.dataset.n); else if (e.target.closest('.s-all')) closeSearch(); });
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((e.key === '/' && !typing) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) { e.preventDefault(); openSearch(); }
    else if (e.key === 'Escape') closeSearch();
  });
}

/* ---------- Detail drawer ---------- */
function stepsHTML(i) {
  const r = R(i), ok = '<span class="st-ok">Passes</span>', no = '<span class="st-no">Does not pass</span>', nr = '<span class="st-na">Not reached</span>';
  const pd = M3 && M3.prod[i.hs6] && i.prod != null ? M3.prod[i.hs6] : null;
  const fwd = r.d >= TH.D_MIN && !r.alt;
  const why = [];
  if (r.pdom) why.push(`China makes ${pct(i.prod)} of world output (line: ${TH3.PROD_MAKE}%), so it fails the Substitutability Test whatever the other measures say`);
  if (r.sw2 != null && r.sw2 >= TH.S_MIN) why.push(`China's share of world exports is ${pct(r.sw2)}`);
  if (i.cv != null && i.cv < TH.CV_MIN) why.push(`India's imports from China are ${coverOf(i.cv).x} of non-China exports, above 5%`);
  if (r.sw2 == null) why.push('there is no supplier data, so it is not set aside');
  const capT = { pci: `PCI ${pciFmt(i.pci)}`, prod: `China makes ${pct(i.prod)} of world output`, ubq: `${i.ubq} competitive exporters`, ns: 'national-security sector' };
  const capPass = (r.routes || []).filter(x => x !== 'ns' && x !== 'prod'), mk = fwd && !['opp', 'na'].includes(r.cat);
  const steps = [
    ['Adversary', ok, 'China, passed by default'],
    ['Dependence', r.d >= TH.D_MIN ? ok : no, `${pct(r.d)} of India's imports come from China (line: 30%)`],
    ['Scale', r.d < TH.D_MIN ? nr : r.rif >= TH.RIF_MIN ? ok : no, `RIF ${rifFmt(r.rif)}, ${RIFNAME[r.rc]}${i.eu ? `. Channel: ${CHAN_L[i.eu]} (${({ I: 'input to production', K: 'equipment', C: 'consumer good', D: 'dual use' })[i.eu]})` : ''}`],
    ['Substitutability: alternatives', r.d < TH.D_MIN ? nr : r.pdom ? '<span class="st-ok">China dominates production</span>' : r.alt ? '<span class="st-no">Alternatives exist</span>' : '<span class="st-ok">Alternatives not enough</span>',
      `China's export share ${i.sw != null ? pct(i.sw) : 'n/a'}${i.prod != null ? `; production share ${pct(i.prod)}${pd ? ` (${esc(pd.stage)}, ${esc(pd.source)})` : ''}` : ''}; India's imports from China are ${i.cv == null ? 'n/a' : coverOf(i.cv).x} of non-China exports.${fwd && why.length ? ` Goes forward because ${why.join(', and ')}.` : ''}`],
    ['Substitutability: PCI', !fwd ? nr : mk ? ok : r.cat === 'na' ? '<span class="st-no">Not assessed</span>' : '<span class="st-no">PCI below 1</span>',
      `PCI ${pciFmt(i.pci)} (line: 1)${i.prod != null ? `; China's production share ${pct(i.prod)} (line: ${TH3.PROD_MAKE}%)` : ''}${fwd && !mk ? (r.cat === 'na' ? '. No PCI score, so this part cannot be tested' : '. The PCI is below 1, so the item is set aside as low-complexity dependence') : ''}`],
    ['Capability gap', !mk ? nr : capPass.length ? ok : no,
      `PCI ${pciFmt(i.pci)} (line: 1.75); competitive exporters ${i.ubq ?? 'n/a'} (line: 5 or fewer${i.eu === 'C' ? ', not applied to consumer goods' : ''})`],
    ['National security', !mk ? nr : i.ns ? ok : no, (i.ns ? esc(NS_HEADINGS[i.hs8.slice(0, 4)]) : 'Not in a listed sector') + (mk && STRAT.includes(r.cat) ? '. No capability gap and no security sector, so the item is strategic' : '')],
  ];
  const v = badge(gkey(r));
  const passes = (r.routes || []).map(x => capT[x]);
  return `<h3>How the method decides, ${FY[S.year]}</h3><ol class="steps">${steps.map(([k, st, t]) => `<li><span class="st-k">${k}</span>${st}<span class="st-t">${t}</span></li>`).join('')}</ol>
    <p class="st-v">Result: ${v}${passes.length ? `<span class="sub">Passes: ${passes.join(' · ')}</span>` : ''}</p>`;
}

function openDetail(hs8) {
  const i = BY_HS8.get(hs8);
  if (!i) return;
  const band = pciBand(i.pci);
  const sib = (BY_HS6.get(i.hs6) || []).filter(x => x !== i);
  const rows = [
    ['Total imports (US$ mn)', r => nf(r.t, 2)],
    ['Imports from China (US$ mn)', r => nf(r.c, 2)],
    ['Dependence', r => pct(r.d)],
    ['Dependence tier', r => depTier(r.d)],
    ['RIF', r => rifFmt(r.rif)],
    ['RIF class', r => RIFNAME[r.rc]],
    ['Verdict', r => badge(gkey(r))],
  ];
  const dr = $('#drawer');
  dr.innerHTML = `
    <div class="dr-top"><div class="dr-eyebrow">HS8 ${i.hs8}</div>
      <button class="btn" type="button" id="drClose">Close</button></div>
    <h2>${esc(i.name)}</h2>
    ${DATA.hs6[i.hs6] ? `<p class="oec">HS6 ${i.hs6}: ${esc(DATA.hs6[i.hs6])}</p>` : `<p class="oec">HS6 ${i.hs6}: no OEC entry</p>`}
    <div class="pcirow">
      <div><div class="k">PCI 2024</div><div class="v">${pciFmt(i.pci)}</div></div>
      <div><div class="k">Complexity</div><div class="v">${band ? COMPLEXITY[band] : 'n/a'}</div></div>
      ${i.sw != null ? `<div><div class="k">China's share of global exports</div><div class="v">${pct(i.sw)}</div></div><div><div class="k">India's imports from China as % of non-China exports</div><div class="v">${i.cv == null ? 'n/a' : `<span ${ecAttrs(i)}>${coverOf(i.cv).x}</span>`}</div></div>` : ''}
    </div>
    ${stepsHTML(i)}
    ${i.ns ? `<p class="dr-flag ns">This item is in a <b>national-security sector</b>: ${esc(NS_HEADINGS[i.hs8.slice(0, 4)])}. ${CRIT.includes(R(i).cat) ? 'It clears the dependence, scale and substitutability gates, so it is critical outright.' : 'If it cleared the dependence, scale and substitutability gates, it would be critical outright.'}</p>` : ''}
    ${R(i).cat === 'alt' ? `<p class="dr-flag bk"><b>Alternatives exist.</b> China supplies ${pct(i.sw)} of global exports of this product${i.cv != null ? `, and India's imports from China are ${coverOf(i.cv).x} of non-China exports, so other countries could replace China easily` : ''}. The item is set aside at the Substitutability Test. With a Severe or Major scale it is graded a Vulnerability: large shock, shorter disruption; otherwise it is graded Dependence.</p>` : ''}
    ${R(i).wkind ? `<p class="dr-flag wl"><b>Vulnerability: small shock, longer disruption.</b> This item fails the Substitutability Test. But its Scale of Disruption is Insignificant (RIF below 0.01). It needs a case-by-case look.</p>` : ''}
    ${i.basket ? '<p class="dr-flag bk"><b>Basket line.</b> This is a residual "other" line. Its PCI is an average for a mixed group of products, so read its verdict with care.</p>' : ''}
    <h3>By year</h3>
    <div class="scroll-x"><table class="data years"><thead><tr><th></th>${YEARS.map(y => `<th class="n">${FY[y].slice(3)}</th>`).join('')}</tr></thead><tbody>
      ${rows.map(([k, f]) => `<tr><td>${k}</td>${YEARS.map(y => `<td class="n">${f(i.y[y])}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>
    ${suppHTML(i)}
    ${sib.length ? `<h3>Other lines under HS6 ${i.hs6}</h3>${sib.map(x => `<button type="button" class="sib" data-hs8="${x.hs8}"><span class="mono">${x.hs8}</span>${esc(x.name)} ${badge(gkey(R(x)))}</button>`).join('')}` : ''}
    <p class="cap" style="margin-top:22px"><a href="#explorer?q=${i.hs6}">Open HS6 ${i.hs6} in the Vulnerability Explorer</a> · <a href="#methodology?s=contact&hs8=${i.hs8}">Suggest a correction to this item</a></p>`;
  dr.classList.add('open');
  dr.setAttribute('aria-hidden', 'false');
  document.body.classList.add('locked');
  $('#drClose').addEventListener('click', closeDetail);
  $$('.sib', dr).forEach(b => b.addEventListener('click', () => openDetail(b.dataset.hs8)));
  dr.scrollTop = 0;
  $('#drClose').focus();
}

function closeDetail() {
  const dr = $('#drawer');
  if (!dr || !dr.classList.contains('open')) return;
  dr.classList.remove('open');
  dr.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('locked');
}

// Logo: "INDIA TRADE" is letter-spaced so it spans exactly the width of "bservatory" (refits on font load and resize)
function fitLogo() {
  const a = document.querySelector('.home-link .w0'), b = document.querySelector('.home-link .w1');
  if (!a || !b) return;
  a.style.letterSpacing = '0'; a.style.width = 'auto';
  const W = b.getBoundingClientRect().width, nat = a.getBoundingClientRect().width, n = a.textContent.length;
  if (W && nat) { a.style.letterSpacing = ((W - 2 - nat) / (n - 1)) + 'px'; a.style.width = (W - 1) + 'px'; }
}
fitLogo();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLogo);
{ let ft; addEventListener('resize', () => { clearTimeout(ft); ft = setTimeout(fitLogo, 120); }); }
</script>
